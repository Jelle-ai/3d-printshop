<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extrudo — 3D-prints op maat</title>
<meta name="theme-color" content="#F5F4F0" />
<meta name="description" content="3D-prints op maat. Kies uit de collectie of upload je eigen model — wij printen het in Bambu Lab-filament en sturen het op." />
<script>
  (function(){
    var t;
    try{ t = localStorage.getItem('lc_theme'); }catch(e){}
    if (t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</noscript>
<style>
  /* =================================================================
     Technisch, niet zacht. Haarlijnen in plaats van schaduwen, bijna
     rechte hoeken, cijfers altijd in mono, en één signaalkleur die
     spaarzaam gebruikt wordt.
     ================================================================= */
  :root{
    --paper:#F5F4F0; --surface:#FFFFFF; --surface2:#EDECE6; --line:#DEDCD3; --line-strong:#C6C3B7;
    --ink:#111214; --muted:#6E6C64;
    --accent:#FF3B00; --accent-ink:#FFFFFF; --signal:#0F766E;
    --plate:#16171A;
    --grid:rgba(17,18,20,.05);
  }
  :root[data-theme="dark"]{
    --paper:#0F1012; --surface:#16171A; --surface2:#1D1F23; --line:#26282C; --line-strong:#3A3D43;
    --ink:#F0EFEA; --muted:#8E8C84;
    --accent:#FF5A2B; --accent-ink:#111214; --signal:#2DD4BF;
    --plate:#16171A;
    --grid:rgba(240,239,234,.05);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Archivo','IBM Plex Sans',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
  .font-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  a{color:inherit;text-decoration:none;}
  button, select, input, textarea{font-family:inherit;font-size:14px;color:inherit;}
  /* dubbeltikken op een knop zoomt anders in op een telefoon */
  button, a, label, select, .card, summary{touch-action:manipulation;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .muted{color:var(--muted);}
  .hidden{display:none !important;}
  .rel{position:relative;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;}

  /* ---------- strook + kop ---------- */
    background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  }

  header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--ink);}
  .header-inner{max-width:1140px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  @media(max-width:640px){.header-inner{padding:12px 16px;}}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink);padding:0;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}
  .brand-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;text-transform:uppercase;}
  .nav-right{display:flex;align-items:center;gap:8px;}
  .iconbtn{
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:10px;font-size:15px;transition:background .12s,border-color .12s;
  }
  .iconbtn:hover{background:var(--surface2);border-color:var(--ink);}
  .iconbtn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .cart-count{
    position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;
    background:var(--accent);color:var(--accent-ink);border-radius:999px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- uitklapmenu ---------- */
  .menu-wrap{position:relative;}
  .menu-panel{
    position:absolute;right:0;top:calc(100% + 9px);min-width:250px;z-index:50;
    background:var(--surface);border:1px solid var(--ink);border-radius:14px;
    box-shadow:6px 6px 0 var(--ink);padding:6px;
  }
  :root[data-theme="dark"] .menu-panel{box-shadow:6px 6px 0 var(--line-strong);}
  .menu-item{
    display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;
    background:none;border:none;border-radius:9px;font-size:14px;text-align:left;color:var(--ink);
  }
  .menu-item:hover{background:var(--surface2);}
  .menu-item i{width:16px;text-align:center;color:var(--muted);}
  .menu-item:hover i{color:var(--accent);}
  .menu-sep{height:1px;background:var(--line);margin:6px 4px;}
  .menu-label{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);padding:9px 11px 5px;
  }

  /* ---------- raamwerk ---------- */
  main{max-width:1140px;margin:0 auto;padding:0 24px 120px;}
  @media(max-width:640px){main{padding:0 16px 96px;}}
  .rule{height:1px;background:var(--line);margin:0;}
  .section-head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:22px;
  }
  .label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .label-accent{color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{padding:56px 0 44px;border-bottom:1px solid var(--ink);margin-bottom:32px;}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:end;}
  @media(min-width:820px){.hero-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;}}
  .hero h1{font-size:clamp(34px,7vw,66px);margin:14px 0 0;max-width:15ch;}
  .hero-sub{color:var(--muted);max-width:46ch;margin:18px 0 0;font-size:15px;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .spec-strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:34px;}
  .spec-strip div{padding:14px 0 0;border-right:1px solid var(--line);}
  .spec-strip div:last-child{border-right:none;}
  .spec-strip dt{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;}
  .spec-strip dd{margin:0;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;}

  /* ---------- knoppen ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:12px 20px;border-radius:10px;border:1px solid var(--ink);
    font-weight:600;font-size:14px;background:var(--surface);color:var(--ink);
    transition:transform .1s, box-shadow .1s, background .12s;
  }
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .btn-accent:hover{box-shadow:3px 3px 0 var(--ink);}
  .btn:active{transform:none;box-shadow:none;}
  .btn:disabled{opacity:.45;pointer-events:none;}
  .btn-ghost{border-color:var(--line-strong);}
  .btn-sm{padding:8px 13px;font-size:13px;}
  .back{background:none;border:none;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:7px;padding:0;margin-bottom:20px;}
  .back:hover{color:var(--accent);}

  /* ---------- collectie ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:16px;overflow:hidden;}
  @media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{
    text-align:left;border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);color:var(--ink);
    padding:14px;display:flex;flex-direction:column;gap:12px;transition:background .14s;
  }
  .card:hover{background:var(--surface);}
  .thumb{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;background:var(--plate);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb i{font-size:30px;color:var(--muted);}
  .card-title{font-size:14px;font-weight:600;line-height:1.3;}
  .price{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:-.02em;}
  .card .price{white-space:nowrap;font-size:15px;}
  .flag{
    position:absolute;top:8px;left:8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 8px;
  }

  /* ---------- panelen ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .panel + .panel{margin-top:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .panel-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .cart-item, .order-card, .admin-row, .fil-block, .part-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;
  }
  /* ---------- winkelwagen ----------
     De bovenste helft vertelt wát je koopt, de onderste wat het kost en
     hoeveel. Niets staat naast elkaar geperst, dus niets valt weg. */
  .wagen-kop{display:flex;align-items:flex-start;gap:11px;}
  .wagen-tekst{min-width:0;flex:1;}
  .wagen-naam{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word;}
  .wagen-specs{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
  .wagen-spec{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.35;}
  .wagen-spec .sleutel{
    color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;text-transform:uppercase;flex:0 0 74px;padding-top:2px;
  }
  .wagen-spec .waarde{min-width:0;flex:1;word-break:break-word;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .wagen-spec .fil-chip{width:16px;height:16px;border-radius:5px;flex-shrink:0;}
  .wagen-deel{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;}
  .wagen-voet{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:13px;padding-top:12px;border-top:1px solid var(--line);
  }
  .wagen-prijs{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .wagen-prijs .totaal{font-size:15px;font-weight:600;}
  @media(max-width:420px){ .wagen-spec{flex-direction:column;gap:2px;} .wagen-spec .sleutel{flex:none;} }
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;}
  .kv span:first-child{color:var(--muted);}
  .kv span:last-child{font-family:'IBM Plex Mono',monospace;}

  /* ---------- formulieren ---------- */
  input, textarea, select.field{
    width:100%;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);
    border-radius:9px;padding:10px 12px;margin-bottom:10px;transition:border-color .12s;
  }
  input:focus, textarea:focus, select.field:focus{outline:none;border-color:var(--accent);}
  /* Op een telefoon zoomt de browser vanzelf in zodra je een invoerveld
     aantikt dat kleiner is dan 16px — en hij zoomt daarna niet terug uit.
     Daarom zijn de velden daar een maat groter. */
  @media (pointer: coarse){
    input, textarea, select, button, select.field{font-size:16px;}
    .btn-sm{font-size:14px;}
  }
  label.field-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:5px;
  }
  .checkbox-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .form-grid{display:grid;grid-template-columns:1fr;gap:0 12px;}
  @media(min-width:400px){.form-grid{grid-template-columns:1fr 1fr;}}
  .stepper{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface);}
  .stepper button{width:36px;height:40px;background:transparent;border:none;color:var(--ink);font-size:12px;}
  .stepper button:hover{background:var(--surface2);}
  .stepper span{width:34px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;}
  input[type=range]{accent-color:var(--accent);padding:0;background:none;border:none;}
  .tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--ink);flex-wrap:wrap;}
  .tab{
    padding:9px 15px;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--muted);margin-bottom:-1px;font-weight:500;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);}

  /* ---------- meldingen ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    border-radius:12px;padding:13px 18px;font-size:13px;z-index:60;max-width:calc(100vw - 32px);
    display:flex;align-items:center;gap:10px;
  }
  .toast i{color:var(--accent);}
  .notice{border:1px solid var(--accent);border-left-width:3px;border-radius:12px;padding:13px 15px;background:var(--surface);}
  .notice-title{color:var(--accent);font-weight:600;font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);
  }
  .badge-accent{border-color:var(--accent);color:var(--accent);}
  .footer-note{font-size:12px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:8px;}

  /* ---------- product ---------- */
  .product-layout{display:grid;grid-template-columns:1fr;gap:30px;}
  @media(min-width:820px){.product-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;align-items:start;}}
  .viewer{width:100%;aspect-ratio:1/1;background:var(--plate);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;}
  .viewer img{width:100%;height:100%;object-fit:cover;display:block;}
  .viewer canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  .viewer canvas:active{cursor:grabbing;}
  .viewer-tag{
    position:absolute;left:10px;bottom:10px;border-radius:999px;background:var(--ink);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;
  }
  .viewer-hint{
    position:absolute;right:8px;bottom:8px;color:var(--paper);opacity:.55;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  }
    /* kleurvakken: één per benoemd stuk van het model */
  .slot{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--surface);}
  .slot.open{border-color:var(--accent);}
  .slot-head{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;
    background:none;border:none;cursor:pointer;color:inherit;text-align:left;
  }
  .slot-head:hover{background:var(--surface2);}
  .slot-head .fil-chip{width:22px;height:22px;border-radius:7px;flex-shrink:0;}
  .slot-name{display:block;font-size:13px;font-weight:600;}
  .slot-fil{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
  .slot-caret{color:var(--muted);flex-shrink:0;}
  .slot-body{padding:0 12px 12px;}
  /* korting */
  /* de bestelling waar een link uit een bericht naartoe wees */
  .aangewezen{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    transition:box-shadow .3s, border-color .3s;
  }
  .sale-flag{
    display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
    padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.06em;
  }
  .was{color:var(--muted);text-decoration:line-through;font-weight:400;margin-right:6px;}
  .viewer-toggle{
    position:absolute;right:8px;top:8px;padding:5px 10px;font-size:11px;
    background:rgba(20,20,20,.72);color:var(--paper);border-color:rgba(255,255,255,.22);
    backdrop-filter:blur(3px);
  }
  .viewer-toggle:hover{background:rgba(20,20,20,.9);border-color:rgba(255,255,255,.4);}
  .strip{display:flex;gap:8px;margin-top:8px;}
  .strip button{
    width:60px;height:60px;overflow:hidden;border:none;border-radius:9px;background:var(--plate);padding:0;flex-shrink:0;
    position:relative;opacity:.5;transition:opacity .12s;
  }
  .strip button.active{opacity:1;}
  .strip button.active::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--accent);}
  .strip img{width:100%;height:100%;object-fit:cover;display:block;}
  .strip i{color:var(--muted);}
  .spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:20px 0;}
  .spec{background:var(--surface);padding:11px 12px;}
  .spec .label{display:block;margin-bottom:3px;}
  .spec-val{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .stock-dot{display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:7px;}

  /* ---------- filament ---------- */
  .fil-types{display:flex;flex-wrap:wrap;gap:0;margin-bottom:14px;border:1px solid var(--line-strong);border-radius:11px;overflow:hidden;}
  .fil-type{
    padding:8px 13px;font-size:12px;background:var(--surface);border:none;
    border-right:1px solid var(--line);color:var(--muted);flex:1 1 auto;
  }
  .fil-type:last-child{border-right:none;}
  .fil-type.active{background:var(--ink);color:var(--paper);font-weight:600;}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .swatch{position:relative;aspect-ratio:1/1;border:none;padding:0;}
  .swatch.active::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);}
  .swatch .tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .fil-chosen{display:flex;align-items:center;gap:13px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
  .fil-chip{width:44px;height:44px;border-radius:9px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);}
  .fil-sheen{background-image:linear-gradient(115deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.5) 44%,rgba(255,255,255,0) 60%);}
  .fil-gloss{background-image:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.11) 46%,rgba(255,255,255,0) 60%);}
  .fil-row{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line);}
  .fil-row:first-of-type{border-top:none;}
  .fil-dot{width:26px;height:26px;border-radius:7px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);}
  .toggle{width:42px;height:23px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface2);position:relative;flex-shrink:0;padding:0;}
  .toggle.on{background:var(--accent);border-color:var(--accent);}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:17px;border-radius:999px;background:var(--surface);transition:left .12s;}
  .toggle.on::after{left:22px;background:var(--accent-ink);}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, orderBy, serverTimestamp, Bytes
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* =====================================================================
   Modellen bewaren zonder Firebase Storage.
   Storage vraagt sinds eind 2024 een betaalplan. Firestore niet, en daar
   past een model prima in: we persen het samen en knippen het in stukken
   die elk onder de documentgrens van 1 MB blijven.
   ===================================================================== */
const CHUNK_BYTES = 700000;          // ruim onder de grens van 1 MiB
const MAX_FIRESTORE_BYTES = 24 * 1024 * 1024;

/* Vingerafdruk van het bestand. Bij het ophalen rekenen we hem opnieuw uit;
   komt hij niet overeen, dan is er onderweg iets misgegaan en zeggen we dat
   in plaats van stilzwijgend een kapot bestand af te leveren. */
async function fileHash(bytes){
  if (!crypto?.subtle) return null;
  const d = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* Schrijft één bestand als een reeks documenten onder de opdracht.
   Bewust ongewijzigd: de bytes gaan er precies zo in als ze binnenkwamen. */
async function storeFileInFirestore(jobId, index, file, onProgress){
  const raw = new Uint8Array(await file.arrayBuffer());
  if (raw.length > MAX_FIRESTORE_BYTES){
    throw new Error(`"${file.name}" is ${(raw.length/1024/1024).toFixed(1)}MB — dat is te groot om zonder aparte opslag te bewaren (max ${MAX_FIRESTORE_BYTES/1024/1024}MB)`);
  }
  const sha = await fileHash(raw);
  const chunks = Math.ceil(raw.length / CHUNK_BYTES);
  for (let c = 0; c < chunks; c++){
    const slice = raw.subarray(c * CHUNK_BYTES, (c + 1) * CHUNK_BYTES);
    await setDoc(doc(db, "uploads", jobId, "files", `${index}_${c}`), { b: Bytes.fromUint8Array(slice) });
    if (onProgress) onProgress(Math.min(file.size, (c + 1) / chunks * file.size));
  }
  return { kind: "firestore", chunks, bytes: raw.length, sha };
}

/* Haalt zo'n bestand weer op, controleert het en biedt het aan als download. */
async function downloadStoredFile(jobId, index, desc, fileName){
  const parts = [];
  for (let c = 0; c < desc.chunks; c++){
    const snap = await getDoc(doc(db, "uploads", jobId, "files", `${index}_${c}`));
    if (!snap.exists()) throw new Error("een stuk van het bestand ontbreekt");
    parts.push(snap.data().b.toUint8Array());
  }
  const total = parts.reduce((s, p) => s + p.length, 0);
  const joined = new Uint8Array(total);
  let at = 0;
  for (const p of parts){ joined.set(p, at); at += p.length; }

  // oudere opdrachten zijn nog samengeperst opgeslagen
  const raw = desc.gz && typeof DecompressionStream !== "undefined"
    ? new Uint8Array(await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())
    : joined;

  if (desc.bytes && raw.length !== desc.bytes){
    throw new Error(`het bestand is onvolledig (${raw.length} van ${desc.bytes} bytes)`);
  }
  if (desc.sha){
    const nu = await fileHash(raw);
    if (nu && nu !== desc.sha) throw new Error("de vingerafdruk klopt niet — het bestand is onderweg gewijzigd");
  }

  const url = URL.createObjectURL(new Blob([raw], { type: "application/octet-stream" }));
  const a = document.createElement("a");
  a.href = url; a.download = fileName || "model.stl";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* Links in een e-mail wijzen naar een plek in de shop, niet naar de voorpagina.

const orderLink   = (o) => `${SITE_URL}?bestelling=${encodeURIComponent(o.id)}`;

/* Leest zo'n link uit en onthoudt waar we naartoe moeten. Het adres wordt
   daarna schoongeveegd, zodat herladen niet opnieuw dezelfde sprong maakt. */
function leesLink(){
  // Een gewone parameter (?bestelling=…) overleeft mailclients en doorstuurders
  // beter dan een #-deel. Dat laatste blijven we lezen voor berichten die al
  // verstuurd zijn.
  const q = new URLSearchParams(location.search);
  if (q.get("bestelling")) return { view: "account", orderId: q.get("bestelling") };
  if (q.get("ontvangen"))  return { view: "account", orderId: q.get("ontvangen"), actie: "ontvangen" };
  const p = q.get("pagina");
  if (p && ["account","archief","custom","cart","shop"].includes(p)) return { view: p };

  const h = decodeURIComponent(location.hash || "").replace(/^#/, "");
  if (!h) return null;
  const [wat, id] = h.split("/");
  if (wat === "bestelling" && id) return { view: "account", orderId: id };
  if (wat === "ontvangen" && id) return { view: "account", orderId: id, actie: "ontvangen" };
  if (["account","archief","custom","cart","shop"].includes(wat)) return { view: wat };
  return null;

   beveiliging: de echte grens ligt in de Firestore-regels, want alles wat
   hier staat draait in de browser van de bezoeker. */
const ADMIN_EMAILS = ["jelle@mattan.be"];
function isAdminEmail(email){ return ADMIN_EMAILS.includes(String(email || "").trim().toLowerCase()); }

/* Tijdens registreren schrijft doRegister het profiel zelf. Deze callback vuurt
   al vlak na het aanmaken van het account, dus vóór dat schrijven klaar is —
   zonder deze vlag zou hij een leeg profiel aanmaken en naam en adres wissen. */
let registering = false;

onAuthStateChanged(auth, async (u) => {
  state.user = u;
  if (u) {
    if (!registering) try{
      state.profile = await loadOrCreateProfile(u);
      state.profileError = null;
    }catch(err){
      // Firestore even niet bereikbaar mag je niet uitloggen. We werken verder
      // met wat Auth ons geeft, zodat de accountknop blijft kloppen.
      state.profileError = err;
      state.profile = state.profile || {
        name: (u.email || "").split("@")[0],
        email: u.email, address: {}, isAdmin: isAdminEmail(u.email),
      };
    }
    listenOrders();
    listenProducts(); // opnieuw luisteren (beheerder ziet alles)
  } else {
    state.profile = null;
    state.profileError = null;
    state.orders = [];
    listenProducts();
  }
  bewaakView();
  renderAuthNav();
  render();
});

/* Na een herlaadbeurt mag een teruggezette pagina niet meer tonen dan mag. */
function bewaakView(){
  if (state.view === "admin" && !state.profile?.isAdmin) state.view = "shop";
  if (state.view === "account" && !state.user) state.view = "shop";
  bewaarView();
}

/* Haalt het profiel op, maakt het aan als het ontbreekt, en zorgt dat de
   vaste beheerdersadressen hun rechten krijgen. */
async function loadOrCreateProfile(u){
  const profileRef = doc(db, "users", u.uid);
  const snap = await getDoc(profileRef);
  if (!snap.exists()){
    const profile = {
      name: (u.email || "").split("@")[0],
      email: u.email, address: {},
      isAdmin: isAdminEmail(u.email), createdAt: Date.now(),
    };
    await setDoc(profileRef, profile);
    return profile;
  }
  const profile = snap.data();
  if (isAdminEmail(u.email) && !profile.isAdmin){
    await updateDoc(profileRef, { isAdmin: true });
    profile.isAdmin = true;
  }
  return profile;
}

async function doRegister(name, email, password, address){
  registering = true;
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const profile = { name, email, address, isAdmin: isAdminEmail(email), createdAt: Date.now() };
    await setDoc(doc(db, "users", cred.user.uid), profile);
    state.profile = profile;
    // De luisteraar startte al vóór dit profiel er was en luistert dus als
    // klant. Voor een beheerder is dat te weinig — opnieuw aanhaken.
    if (profile.isAdmin) listenOrders();
    renderAuthNav();
    notify("Account aangemaakt — welkom " + name);
    go("shop");
  }catch(e){
    notify("Fout: " + (e.message || e));
  }finally{
    registering = false;
  }
}
async function doLogin(email, password){
  try{
    await signInWithEmailAndPassword(auth, email, password);
    notify("Ingelogd");
    go("shop");
  }catch(e){ notify("Fout: " + (e.message || e)); }
}
async function doLogout(){
  await signOut(auth);
  notify("Uitgelogd");
  go("shop");
}

/* --------------------------- products (realtime) --------------------------- */
function listenProducts(){
  const q = query(collection(db, "products"), orderBy("name"));
  // Bestaat de database niet, dan roept Firestore géén foutcallback aan maar
  // blijft het stil opnieuw proberen. Zonder deze timer blijft de shop dan
  // eindeloos op "laden" staan zonder uitleg.
  clearTimeout(state.__productsTimer);
  state.__productsTimer = setTimeout(() => {
    if (!state.productsLoaded){
      state.productsStalled = true;
      if (state.view === "shop") render();
    }
  }, 8000);
  onSnapshot(q, (snap) => {
    clearTimeout(state.__productsTimer);
    state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.productsLoaded = true;
    state.productsError = null;
    state.productsStalled = false;
    // Na een herlaadbeurt op een productpagina: het product weer opzoeken.
    if (!state.selectedProduct && state.selectedProductId){
      const p = state.products.find(x => x.id === state.selectedProductId);
      if (p) state.selectedProduct = p;
      else if (state.view === "product") state.view = "shop";
    }
    if (state.view === "shop" || state.view === "product" || state.view === "admin") render();
  }, (err) => {
    clearTimeout(state.__productsTimer);
    state.productsLoaded = true;
    state.productsError = err;
    state.productsStalled = false;
    render();
  });
}

/* De hele catalogus zit in één document: één lees, één schrijf, en toggles
   blijven snel. Voor een winkel met één beheerder is dat ruim voldoende. */
const FILAMENT_DOC = () => doc(db, "settings", "filaments");

function listenFilaments(){
  onSnapshot(FILAMENT_DOC(), async (snap) => {
    if (!snap.exists()){
      try{ await setDoc(FILAMENT_DOC(), { items: buildDefaultFilaments() }); }
      catch(err){ /* regels of database nog niet klaar; de shop meldt dat al */ }
      return;
    }
    state.filaments = Array.isArray(snap.data().items) ? snap.data().items : [];
    if (["shop","product","admin","custom"].includes(state.view)) render();
  }, () => { /* fouten worden al bij de producten gemeld */ });
}

}

/* Alleen wat de klant mag zien: ingeschakeld, en toegestaan voor dit product. */
function availableFilaments(product){
  const on = (state.filaments || []).filter(f => f.enabled);
  const allowed = product?.filamentTypes;
  if (Array.isArray(allowed) && allowed.length) return on.filter(f => allowed.includes(f.type));
  return on;
}
function filamentTypes(list){
  return [...new Set(list.map(f => f.type))];
}
function findFilament(id){ return (state.filaments || []).find(f => f.id === id); }

/* Vertaalt een Firestore-fout naar iets waar je wat mee kunt. */
function firestoreHint(err){
  const code = err?.code || "";
  if (/index/i.test(err?.message || ""))
    return "Deze zoekopdracht heeft een extra index nodig in Firestore. De foutmelding in de browserconsole bevat een link die de index in één klik aanmaakt.";
  if (/permission-denied/.test(code))
    return "Firestore weigert toegang. Zet in de Firebase Console de regels op testmodus (Firestore Database → Rules), of controleer of ze niet verlopen zijn — testregels vervallen na 30 dagen.";
  if (/unavailable|failed-precondition|not-found/.test(code))
    return "De database is nog niet aangemaakt. Ga in de Firebase Console naar Build → Firestore Database en klik op Create database.";
  if (/unauthenticated/.test(code))
    return "Firebase herkent de site niet. Controleer of de configuratie bij het juiste project hoort.";
  return err?.message || String(err);
}

const FILAMENT_DENSITY = {   // g/cm³

   staan jouw echte printtijden er structureel naast, dan stel je ze hier bij

/* De waarden komen uit de openbare profielen van de X1 Carbon met een
   0.4-nozzle: "0.20mm Standard @BBL X1C" voor de snelheden en versnellingen,
   en het filamentprofiel voor de doorvoer. */
const DEFAULT_SLICER = {
  lineWidth: 0.42,          // extrusiebreedte bij een 0.4-nozzle
  walls: 2,                 // aantal wanden
  topShells: 4,             // massieve lagen aan de bovenkant
  bottomShells: 3,          // massieve lagen aan de onderkant
  maxFlow: 21,              // mm³/s, wat de hotend aankan
  speedOuter: 200,          // mm/s buitenwand
  speedInner: 300,          // mm/s binnenwanden
  speedSolid: 250,          // mm/s massieve vlakken
  speedSparse: 270,         // mm/s vulling
  speedTop: 200,            // mm/s bovenvlak: rustiger voor een gladde top
  speedFirst: 50,           // mm/s eerste laag: die moet goed hechten
  accelOuter: 5000,         // mm/s² buitenwand: rustiger voor de afwerking
  accelPrint: 10000,        // mm/s² de rest van het printwerk
  accelFirst: 500,          // mm/s² eerste laag
  travelFactor: 1.08,       // toeslag voor verplaatsen zonder te printen
  layerSec: 1.2,            // vaste tijd per laag
  // Voor het printen begint: opwarmen, bed uitmeten en de nozzle schoonspuiten.
  // Bambu Studio noemt dit "prepare time" en het loopt aardig op.

  // af te koelen. Bij kleine modellen bepaalt dit de printtijd.
  minLayerSec: 8,
