<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LayerCraft — 3D-prints op maat</title>
<meta name="theme-color" content="#F7F7F4" />
<meta name="description" content="3D-prints op maat. Kies uit de collectie of upload je eigen model — wij printen het in Bambu Lab-filament en sturen het op." />
<script>
  /* Thema meteen zetten, vóór de eerste verf, anders flitst de site even in de
     verkeerde kleur. Standaard volgen we de voorkeur van het toestel. */
  (function(){
    var t;
    try{ t = localStorage.getItem('lc_theme'); }catch(e){}
    if (t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Niet-blokkerend: de pagina verschijnt in systeemletters en wisselt zodra
     de webfonts binnen zijn, in plaats van te wachten op Google. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<style>
  :root{
    --bg:#F7F7F4; --surface:#FFFFFF; --surface2:#EFEFEA; --line:#E3E3DC;
    --text:#181A1D; --muted:#6C7178;
    --orange:#D8451A; --teal:#0B7F76; --on-accent:#FFFFFF;
    --swatch-ring:rgba(0,0,0,.20); --teal-glow:rgba(11,127,118,.22);
    --shadow-sm:0 1px 2px rgba(24,26,29,.06);
    --shadow:0 1px 3px rgba(24,26,29,.06), 0 10px 28px -14px rgba(24,26,29,.22);
    --shadow-lg:0 2px 6px rgba(24,26,29,.07), 0 20px 44px -18px rgba(24,26,29,.28);
    --header-bg:rgba(247,247,244,.82);
  }
  :root[data-theme="dark"]{
    --bg:#15171b; --surface:#1E2126; --surface2:#262A30; --line:#2E333A;
    --text:#F2F1ED; --muted:#8B8F98;
    --orange:#FF6B35; --teal:#2EC4B6; --on-accent:#15171b;
    --swatch-ring:rgba(255,255,255,.16); --teal-glow:rgba(46,196,182,.24);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 20px 44px -18px rgba(0,0,0,.8);
    --header-bg:rgba(21,23,27,.82);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:700;letter-spacing:-.015em;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  a{color:inherit;}
  button, select, input, textarea{font-family:inherit;font-size:14px;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  header{
    position:sticky;top:0;z-index:30;background:var(--header-bg);
    backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{max-width:1040px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;background:none;border:none;color:var(--text);padding:0;}
  .brand span{font-size:18px;}
  .navbtn{
    display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;
    box-shadow:var(--shadow-sm);transition:border-color .15s, transform .15s;
  }
  .navbtn:hover{border-color:var(--muted);}
  .navbtn:active{transform:translateY(1px);}
  .navbtn.primary{background:var(--orange);color:var(--on-accent);border-color:transparent;font-weight:600;}
  nav{display:flex;align-items:center;gap:8px;}
  #authNav{display:flex;align-items:center;gap:8px;}
  @media(max-width:640px){
    .header-inner{padding:12px 14px;gap:8px;}
    nav{gap:6px;}
    #authNav{gap:6px;}
    .navbtn{padding:8px 10px;}
  }
  main{max-width:1040px;margin:0 auto;padding:0 24px 110px;}
  @media(max-width:640px){main{padding:0 16px 96px;}}
  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding:64px 0 56px;}
  /* Op een breed scherm staat de illustratie rechts naast de tekst in plaats
     van erboven; row-reverse zet het eerste kind (de lagen) aan de rechterkant. */
  @media(min-width:760px){
    .hero{flex-direction:row-reverse;justify-content:space-between;gap:56px;padding:88px 0 68px;flex-wrap:nowrap;}
    .layers{height:240px;width:240px;}
    .layer{height:20px;margin-bottom:3px;}
  }
  .hero h1{font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0 0 14px;max-width:16ch;}
  .hero p{color:var(--muted);max-width:44ch;margin:0 0 24px;font-size:16px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 12px;}
  .layers{position:relative;height:168px;width:168px;flex-shrink:0;}
  .layers-inner{position:absolute;inset:0;display:flex;flex-direction:column-reverse;align-items:center;}
  .layer{height:14px;border-radius:3px;margin-bottom:2px;animation:rise .9s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.layer{animation:none;}}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:22px;}}
  .card{
    text-align:left;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:13px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    box-shadow:var(--shadow-sm);transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  @media(prefers-reduced-motion:reduce){.card:hover{transform:none;}}
  .thumb{width:100%;aspect-ratio:1/1;border-radius:11px;background:#22262c;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .price{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--teal);letter-spacing:-.02em;}
  .muted{color:var(--muted);}
  .spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:18px 0;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .spec{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;}
  .spec .label{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.07em;display:block;margin-bottom:4px;}
  input, textarea, select.field{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;margin-bottom:10px;transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select.field:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-glow);}
  label.field-label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;}
  .btn{padding:11px 18px;border-radius:11px;border:none;font-weight:600;font-size:14px;transition:filter .15s, transform .15s;}
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
  .btn-orange{background:var(--orange);color:var(--on-accent);box-shadow:var(--shadow-sm);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text);}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card .price{white-space:nowrap;}
  .back{background:none;border:none;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;padding:0;margin-bottom:18px;}
  .back:hover{color:var(--text);}
  .cart-item, .order-card, .admin-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);}
  .badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 11px;border-radius:999px;background:var(--surface2);color:var(--teal);}
  .upload-box{
    display:flex;flex-direction:column;align-items:center;gap:9px;border:1.5px dashed var(--line);
    border-radius:16px;padding:38px 24px;text-align:center;background:var(--surface);
    transition:border-color .15s, background .15s;
  }
  .upload-box:hover{border-color:var(--teal);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--teal);padding:13px 17px;border-radius:12px;
    font-size:13px;z-index:50;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);
  }
  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .tab{padding:7px 14px;border-radius:999px;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--muted);}
  .tab.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);}
  .stepper button{width:34px;height:38px;background:transparent;border:none;color:var(--text);font-size:15px;}
  .stepper button:hover{background:var(--surface2);}
  .stepper span{width:32px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:14px;}
  .hidden{display:none !important;}
  .qty-badge{position:absolute;top:-6px;right:-6px;background:var(--orange);color:var(--on-accent);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
  .rel{position:relative;}
  .checkbox-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .footer-note{font-size:11px;color:var(--muted);margin-top:14px;display:flex;gap:6px;}
  /* --- productgalerij --- */
  .product-layout{display:grid;grid-template-columns:1fr;gap:32px;}
  @media(min-width:760px){.product-layout{grid-template-columns:1fr 1fr;gap:44px;align-items:start;}}
  .gallery-main{width:100%;aspect-ratio:1/1;border-radius:18px;background:#22262c;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:72px;box-shadow:var(--shadow);}
  .gallery-main img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-strip{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap;}
  .gallery-strip button{width:58px;height:58px;border-radius:11px;overflow:hidden;border:2px solid transparent;background:#22262c;padding:0;flex-shrink:0;transition:border-color .15s;}
  .gallery-strip button.active{border-color:var(--teal);}
  .gallery-strip img{width:100%;height:100%;object-fit:cover;display:block;}
  .cat-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);background:var(--surface2);border-radius:999px;padding:5px 11px;margin-bottom:10px;}
  .card-badge{position:absolute;top:12px;left:12px;z-index:1;font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--orange);color:var(--on-accent);font-weight:700;border-radius:999px;padding:4px 9px;}
  .stock-dot{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:6px;}
  /* --- beheerformulier --- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .img-tray{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px;}
  .img-slot{position:relative;width:64px;height:64px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);}
  .img-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-slot button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;border:none;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .img-add{width:64px;height:64px;border-radius:11px;border:1.5px dashed var(--line);background:var(--surface);color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;}
  .img-add:hover{border-color:var(--teal);color:var(--teal);}
  .admin-row img{width:44px;height:44px;border-radius:9px;object-fit:cover;display:block;}
  .admin-thumb{width:44px;height:44px;border-radius:9px;background:#22262c;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
  /* --- demo-betaling --- */
  .pay-card{background:linear-gradient(135deg,#2F353D,#1A1E23);color:#F2F1ED;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);}
  .pay-card .muted{color:#9AA0A8;}
  .pay-strip{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.14em;margin:16px 0 6px;}
  .demo-banner{background:color-mix(in srgb, var(--orange) 10%, transparent);border:1px solid var(--orange);color:var(--orange);border-radius:12px;padding:12px 14px;font-size:12px;margin-bottom:18px;}
  /* --- bestellingsopvolging --- */
  .track{display:flex;margin:18px 0 10px;}
  .track-step{flex:1;position:relative;text-align:center;}
  .track-step::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line);}
  .track-step:first-child::before{display:none;}
  .track-step.done::before,.track-step.active::before{background:var(--teal);}
  .track-dot{position:relative;z-index:1;display:block;width:16px;height:16px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);margin:0 auto 8px;}
  .track-step.done .track-dot{background:var(--teal);border-color:var(--teal);}
  .track-step.active .track-dot{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb, var(--orange) 20%, transparent);}
  .track-label{font-size:10px;color:var(--muted);line-height:1.3;display:block;padding:0 2px;}
  .track-step.active .track-label{color:var(--text);font-weight:600;}
  .eta{background:var(--surface2);border-radius:11px;padding:11px 13px;font-size:13px;margin:14px 0;}
  .eta strong{color:var(--teal);}
  .order-line{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line);}
  .order-line:first-of-type{border-top:none;}
  .detail-toggle{background:none;border:none;color:var(--teal);font-size:12px;padding:9px 0 0;display:flex;align-items:center;gap:5px;font-weight:600;}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0;}
  .kv span:first-child{color:var(--muted);}
  /* --- filamentkiezer --- */
  .fil-block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:20px 0;box-shadow:var(--shadow-sm);}
  .fil-types{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .fil-type{padding:7px 13px;border-radius:999px;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);}
  .fil-type.active{background:var(--teal);color:var(--surface);border-color:var(--teal);font-weight:600;}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:9px;}
  .swatch{position:relative;aspect-ratio:1/1;border-radius:10px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px var(--swatch-ring);transition:transform .12s;}
  .swatch:hover{transform:scale(1.07);}
  .swatch.active{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--swatch-ring), 0 0 0 3px var(--teal-glow);}
  .swatch .tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
  .fil-chosen{display:flex;align-items:center;gap:13px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line);}
  .fil-chip{width:46px;height:46px;border-radius:11px;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--swatch-ring);}
  .fil-sheen{background-image:linear-gradient(115deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.55) 44%,rgba(255,255,255,0) 60%);}
  /* Bewust subtiel: een te sterke glans vertekent de kleur, en juist die moet kloppen. */
  .fil-gloss{background-image:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.11) 46%,rgba(255,255,255,0) 60%);}
  .preview-note{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.66);color:#F2F1ED;font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 10px;border-radius:999px;}
  /* --- beheer: filamenten --- */
  .fil-row{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line);}
  .fil-row:first-of-type{border-top:none;}
  .fil-dot{width:26px;height:26px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--swatch-ring);}
  .toggle{width:42px;height:24px;border-radius:999px;border:none;background:var(--line);position:relative;flex-shrink:0;padding:0;transition:background .15s;}
  .toggle.on{background:var(--teal);}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:var(--surface);transition:left .15s;box-shadow:var(--shadow-sm);}
  .toggle.on::after{left:21px;}
  /* --- skelet tijdens het laden --- */
  .skel{background:var(--surface2);border-radius:11px;position:relative;overflow:hidden;}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--surface) 70%, transparent),transparent);animation:shimmer 1.4s infinite;}
  @keyframes shimmer{to{transform:translateX(100%)}}
  @media(max-width:640px){.hide-sm{display:none;}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="brand" onclick="go('shop')">
      <span style="color:var(--orange);font-size:20px;">◫</span>
      <span class="font-display">LayerCraft</span>
    </button>
    <nav>
      <button class="navbtn" id="themeBtn" title="Licht of donker" aria-label="Wissel tussen licht en donker">◐</button>
      <button class="navbtn" onclick="go('custom')">⬆ <span class="hide-sm">Eigen model</span></button>
      <button class="navbtn rel" onclick="go('cart')">🛒 <span class="hide-sm">Winkelwagen</span>
        <span id="cartBadge" class="qty-badge hidden">0</span>
      </button>
      <span id="authNav"></span>
    </nav>
  </div>
</header>

<!-- Deze inhoud staat er meteen, nog voor Firebase geladen is. Zonder dit
     blijft het scherm een paar seconden leeg op een trage verbinding.
     De eerste render van de app vervangt het door precies hetzelfde. -->
<main id="app">
  <section class="hero">
    <div class="layers"><div class="layers-inner" id="bootLayers"></div></div>
    <div>
      <p class="eyebrow">FDM print-on-demand</p>
      <h1 class="font-display">Kies een model, of print jouw eigen ontwerp.</h1>
      <p>Bestel uit onze collectie of upload je eigen STL. Wij printen het in Bambu Lab-filament en sturen het naar jouw adres.</p>
      <button class="btn btn-orange" onclick="go('custom')">⬆ Upload je eigen model</button>
    </div>
  </section>
  <div class="section-head">
    <h2 class="font-display" style="font-size:22px;margin:0;">Collectie</h2>
  </div>
  <div class="grid">
    <div class="card"><div class="thumb skel"></div><div><div class="skel" style="height:13px;width:75%;"></div><div class="skel" style="height:11px;width:45%;margin-top:8px;"></div></div></div>
    <div class="card"><div class="thumb skel"></div><div><div class="skel" style="height:13px;width:65%;"></div><div class="skel" style="height:11px;width:50%;margin-top:8px;"></div></div></div>
    <div class="card"><div class="thumb skel"></div><div><div class="skel" style="height:13px;width:80%;"></div><div class="skel" style="height:11px;width:40%;margin-top:8px;"></div></div></div>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script>
  /* Kleine dingen die niet op Firebase hoeven te wachten. */
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeBtn');
    var meta = document.querySelector('meta[name="theme-color"]');
    function paint(){
      var dark = root.getAttribute('data-theme') === 'dark';
      // het icoon toont waar je naartoe gaat, niet waar je bent
      btn.textContent = dark ? '☀' : '☾';

/* =====================================================================
   Prijsberekening
   Een echte slicer draait hier niet in de browser, dus rekenen we met wat
   een slicer ook doet: hoeveel materiaal gaat erin en hoe lang duurt het.
   Voor een geüpload model komt de geometrie uit het bestand zelf; voor een
   model op maat uit de afmetingen die de klant opgeeft.
   ===================================================================== */
const FILAMENT_DENSITY = {   // g/cm³
  "PLA Basic": 1.24, "PLA Matte": 1.22, "PLA Silk+": 1.25,
  "PETG HF": 1.27, "ABS": 1.04, "TPU": 1.21,
};
const DEFAULT_PRICING = {
  pricePerKg: 24.99,        // wat een spoel Bambu Lab kost
  hourlyRate: 3.50,         // machinetijd per uur
  setupFee: 2.50,           // voorbereiden, van de plaat halen, nakijken
  flowRate: 9,              // mm³/s gemiddeld tijdens het printen
  layerOverheadSec: 2.4,    // vaste tijd per laag (bewegen, laagwissel)
  margin: 1.25,             // opslag op de kostprijs
  wallThickness: 1.2,       // mm, standaard 3 perimeters
  minPrice: 4.50,
};
function pricing(){ return { ...DEFAULT_PRICING, ...(state.pricing || {}) }; }

/* Materiaalvolume: de wand plus het ingevulde binnenwerk. */
function printedVolumeMm3({ solidVolume, surfaceArea, infill, wallThickness }){
  const shell = Math.min(surfaceArea * wallThickness, solidVolume);
  const inner = Math.max(0, solidVolume - shell);
  return shell + inner * (infill / 100);
}
/* Printtijd: materiaal door de nozzle, plus vaste tijd per laag. */
function printSeconds(volumeMm3, heightMm, layerHeightMm, p){
  const layers = Math.max(1, Math.ceil(heightMm / (layerHeightMm || 0.2)));
  return volumeMm3 / p.flowRate + layers * p.layerOverheadSec;
}
/* Rekent één schatting door en geeft alle tussenstappen terug, zodat we ze
   aan de klant kunnen tonen in plaats van alleen een getal. */
function estimate({ solidVolume, surfaceArea, heightMm, infill, layerHeight, filamentType, quantity = 1 }){
  const p = pricing();
  const volume = printedVolumeMm3({ solidVolume, surfaceArea, infill, wallThickness: p.wallThickness });
  const seconds = printSeconds(volume, heightMm, layerHeight, p);
  const density = FILAMENT_DENSITY[filamentType] || 1.24;
  const grams = (volume / 1000) * density;              // mm³ → cm³ → gram
  const materialCost = (grams / 1000) * p.pricePerKg;
  const machineCost = (seconds / 3600) * p.hourlyRate;
  const raw = (materialCost + machineCost + p.setupFee) * p.margin;
  const unit = Math.max(p.minPrice, Math.ceil(raw * 20) / 20);   // afronden op 5 cent
  return { volume, seconds, grams, materialCost, machineCost, unit, total: unit * quantity };
}
function fmtDuration(sec){
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h}u ${String(m).padStart(2,"0")}m` : `${m}m`;
}

/* --------------------------- STL inlezen --------------------------- */
/* Leest een STL (binair of ASCII) en geeft het echte volume, de oppervlakte
   en de afmetingen terug. Volume via de som van getekende tetraëders. */
function parseStl(buffer){
  const view = new DataView(buffer);
  let count = 0, vol6 = 0, area2 = 0;
  const min = [Infinity,Infinity,Infinity], max = [-Infinity,-Infinity,-Infinity];

  // Alles wordt al tijdens het lezen opgeteld; er wordt nooit een lijst met
  // driehoeken opgebouwd, zodat ook een bestand van tientallen MB's op een
  // telefoon niet het geheugen opblaast.
  function addTriangle(ax,ay,az, bx,by,bz, cx,cy,cz){
    count++;
    vol6 += ax*(by*cz - bz*cy) - ay*(bx*cz - bz*cx) + az*(bx*cy - by*cx);
    const ux=bx-ax, uy=by-ay, uz=bz-az, vx=cx-ax, vy=cy-ay, vz=cz-az;
    area2 += Math.hypot(uy*vz - uz*vy, uz*vx - ux*vz, ux*vy - uy*vx);
    if (ax<min[0]) min[0]=ax; if (ax>max[0]) max[0]=ax;
    if (bx<min[0]) min[0]=bx; if (bx>max[0]) max[0]=bx;
    if (cx<min[0]) min[0]=cx; if (cx>max[0]) max[0]=cx;
    if (ay<min[1]) min[1]=ay; if (ay>max[1]) max[1]=ay;
    if (by<min[1]) min[1]=by; if (by>max[1]) max[1]=by;
    if (cy<min[1]) min[1]=cy; if (cy>max[1]) max[1]=cy;
    if (az<min[2]) min[2]=az; if (az>max[2]) max[2]=az;
    if (bz<min[2]) min[2]=bz; if (bz>max[2]) max[2]=bz;
    if (cz<min[2]) min[2]=cz; if (cz>max[2]) max[2]=cz;
  }

  const looksBinary = buffer.byteLength >= 84 &&
    view.getUint32(80, true) * 50 + 84 === buffer.byteLength;

  if (looksBinary){
    const n = view.getUint32(80, true);
    for (let i = 0; i < n; i++){
      const o = 84 + i * 50 + 12; // de normaalvector slaan we over
      addTriangle(
        view.getFloat32(o,true),    view.getFloat32(o+4,true),  view.getFloat32(o+8,true),
        view.getFloat32(o+12,true), view.getFloat32(o+16,true), view.getFloat32(o+20,true),
        view.getFloat32(o+24,true), view.getFloat32(o+28,true), view.getFloat32(o+32,true));
    }
  } else {
    const text = new TextDecoder().decode(new Uint8Array(buffer));
    const re = /vertex\s+(-?[\d.eE+-]+)\s+(-?[\d.eE+-]+)\s+(-?[\d.eE+-]+)/g;
    const v = [];
    let m;
    while ((m = re.exec(text))){
      v.push(+m[1], +m[2], +m[3]);
      if (v.length === 9){
        addTriangle(v[0],v[1],v[2], v[3],v[4],v[5], v[6],v[7],v[8]);
        v.length = 0;
      }
    }
  }
  if (!count) return null;
  return {
    triangles: count,
    volume: Math.abs(vol6) / 6,        // mm³
    surface: area2 / 2,                // mm²
    size: [max[0]-min[0], max[1]-min[1], max[2]-min[2]],
  };
}

/* --------------------------- kleurhulpjes --------------------------- */
function hexToRgb(hex){
  const h = String(hex || "").replace("#","").trim();
  const full = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const n = parseInt(full.slice(0,6), 16);
  return Number.isNaN(n) ? { r:128, g:128, b:128 } : { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex({r,g,b}){
  return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
}
/* pct > 0 maakt lichter, pct < 0 donkerder */
function shade(hex, pct){
  const { r,g,b } = hexToRgb(hex);
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct);
  return rgbToHex({ r: r+(t-r)*p, g: g+(t-g)*p, b: b+(t-b)*p });
}
/* Bepaalt of tekst op deze kleur zwart of wit moet zijn. */
function readableOn(hex){
  const { r,g,b } = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#15171b" : "#F2F1ED";
}

/* Bouwt een productafbeelding als SVG: een gestapeld "geprint" object.
   profile(t) geeft de halve breedte terug, t=0 onderaan tot t=1 bovenaan. */
function printSvg(profile, colorA, colorB, bg){
  const rows = 26, top = 72, bottom = 332, h = (bottom - top) / rows;
  let out = "";
  for (let i = 0; i < rows; i++){
    const t = i / (rows - 1);
    const w = Math.max(7, profile(t) * 150);
    const y = bottom - (i + 1) * h;
    out += `<rect x="${(200-w).toFixed(1)}" y="${y.toFixed(1)}" width="${(w*2).toFixed(1)}" height="${(h-2.2).toFixed(1)}" rx="3" fill="${i%2 ? colorB : colorA}" opacity="${(0.58 + 0.42*t).toFixed(2)}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}"/><ellipse cx="200" cy="338" rx="105" ry="12" fill="#000" opacity="0.28"/>${out}</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const PROFILE = {
  vase:  t => 0.34 + 0.30 * Math.sin(Math.PI * t),
  tag:   t => t > 0.80 ? 0.10 : 0.62,
  wedge: t => 0.70 - 0.46 * t,
  box:   t => 0.55,
  bowl:  t => 0.26 + 0.40 * Math.sqrt(t),
};
const SHAPE_LABELS = { vase:"Vaas", tag:"Plaatje", wedge:"Wig", box:"Blok", bowl:"Kom" };

/* Kleurvoorbeeld: hetzelfde object, geprint in het gekozen filament.
   De afwerking bepaalt hoe het licht valt — mat vlak, zijdeglans met een
   duidelijke glans, standaard iets ertussenin. */
function filamentPreview(shape, hex, finish){
  const profile = PROFILE[shape] || PROFILE.box;
  const light = shade(hex, finish === "matte" ? 0.10 : finish === "silk" ? 0.34 : 0.18);
  const dark  = shade(hex, finish === "matte" ? -0.12 : finish === "silk" ? -0.30 : -0.18);
  const rows = 26, top = 72, bottom = 332, h = (bottom - top) / rows;
  let bars = "";
  for (let i = 0; i < rows; i++){
    const t = i / (rows - 1);
    const w = Math.max(7, profile(t) * 150);
    const y = bottom - (i + 1) * h;
    bars += `<rect x="${(200-w).toFixed(1)}" y="${y.toFixed(1)}" width="${(w*2).toFixed(1)}" height="${(h-2.2).toFixed(1)}" rx="3" fill="${i%2 ? dark : light}"/>`;
  }
  // Zijdeglans krijgt een verticale glansband, mat krijgt niets.
  const sheen = finish === "silk"
    ? `<defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
         <stop offset="0" stop-color="#fff" stop-opacity="0"/>
         <stop offset="0.34" stop-color="#fff" stop-opacity="0.42"/>
         <stop offset="0.52" stop-color="#fff" stop-opacity="0.06"/>
         <stop offset="1" stop-color="#fff" stop-opacity="0"/>
       </linearGradient></defs>
       <rect x="60" y="60" width="280" height="285" fill="url(#s)" style="mix-blend-mode:soft-light"/>`
    : finish === "basic"
    ? `<defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
         <stop offset="0" stop-color="#fff" stop-opacity="0"/>
         <stop offset="0.3" stop-color="#fff" stop-opacity="0.14"/>
         <stop offset="1" stop-color="#fff" stop-opacity="0"/>
       </linearGradient></defs>
       <rect x="60" y="60" width="280" height="285" fill="url(#s)" style="mix-blend-mode:soft-light"/>`
    : ``;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">`
    + `<rect width="400" height="400" fill="#22262c"/>`
    + `<ellipse cx="200" cy="338" rx="105" ry="12" fill="#000" opacity="0.28"/>`
    + bars + sheen + `</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* --------------------------- orders (realtime) --------------------------- */
let unsubOrders = null;
function listenOrders(){
  if (unsubOrders) unsubOrders();
  if (!state.user) return;
  const base = collection(db, "orders");
  // Bewust géén orderBy naast de where op uid: die combinatie vereist een
  // samengestelde index in Firestore, en zonder die index faalt de query —
  // waardoor een klant zijn eigen bestellingen niet te zien kreeg terwijl de
  // beheerder (alleen orderBy) ze wel zag. Sorteren doen we hieronder zelf.
  const q = state.profile?.isAdmin
    ? query(base)
    : query(base, where("uid","==",state.user.uid));
  unsubOrders = onSnapshot(q, (snap) => {
    state.orders = snap.docs
      .map(d => ({ id:d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    state.ordersError = null;
    if (state.view === "account" || state.view === "admin") render();
  }, (err) => {
    state.ordersError = err;
    if (state.view === "account" || state.view === "admin") render();
  });
}

async function placeOrder(shippingCountry, address, payment){
  if (!state.user){ notify("Log in om te bestellen"); go("login"); return; }
  const rate = SHIPPING_RATES.find(r=>r.country===shippingCountry) || SHIPPING_RATES[0];
  const order = {
    uid: state.user.uid,
    userEmail: state.user.email,
    items: state.cart.map(({id,productId,kind,name,price,qty,filament,dims,printTime,grams})=>({
      id, productId: productId || id, kind, name, price, qty,
      filament: filament || null, dims: dims || null,
      printTime: printTime || null, grams: grams || null,
    })),
    shippingCountry, shippingAddress: address,
    shippingCost: rate.price,
    subtotal: cartTotal(),
    total: cartTotal() + rate.price,
    status: "In verwerking",
    paymentMethod: payment?.method || "Demo",
    paymentRef: payment?.ref || "",
    demoPayment: true,
    createdAt: Date.now(),
  };
  try{
    await addDoc(collection(db,"orders"), order);
    state.cart = []; saveCart();
    state.__checkout = null;
    notify("Betaald met testgeld — bestelling geplaatst!");
    go("account");
  }catch(e){ notify("Bestellen mislukt: " + e.message); }
}

/* Verkleint een gekozen afbeelding in de browser en geeft een data-URL terug.
   Zo staan productfoto's in het Firestore-document zelf en is Storage niet nodig. */
const IMG_MAX_PX = 1000;
const IMG_MAX_BYTES = 240 * 1024;
function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error("Dat is geen afbeelding"));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Kan het bestand niet lezen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Kan de afbeelding niet openen"));
      img.onload = () => {
        const scale = Math.min(1, IMG_MAX_PX / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = "#22262c";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        let q = 0.82, url = c.toDataURL('image/jpeg', q);
        while (url.length > IMG_MAX_BYTES && q > 0.35){
          q -= 0.12;
          url = c.toDataURL('image/jpeg', q);
        }
        if (url.length > IMG_MAX_BYTES) return reject(new Error("Afbeelding blijft te groot — kies een kleinere"));
        resolve(url);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function isSafeImageSrc(s){ return /^https:\/\//i.test(s) || /^data:image\//i.test(s); }
function productImages(p){ return (Array.isArray(p?.images) ? p.images : []).filter(isSafeImageSrc); }
function productThumb(p, fontSize){
  const imgs = productImages(p);
  return imgs.length
    ? `<img src="${esc(imgs[0])}" alt="${esc(p.name||'')}" loading="lazy" />`
    : `<span style="font-size:${fontSize||32}px;">${esc(p?.icon || "📦")}</span>`;
}

/* --------------------------- cart --------------------------- */
function addToCart(item){
  const existing = state.cart.find(x=>x.id===item.id && x.kind===item.kind);
  if (existing) existing.qty += item.qty; else state.cart.push(item);
  saveCart();
  notify(item.name + " toegevoegd");
  renderCartBadge();
}
function removeFromCart(id,kind){ state.cart = state.cart.filter(x=>!(x.id===id&&x.kind===kind)); saveCart(); render(); }
function setQty(id,kind,qty){ const it=state.cart.find(x=>x.id===id&&x.kind===kind); if(it) it.qty=Math.max(1,qty); saveCart(); render(); }
window.__addToCart = addToCart; window.__removeFromCart = removeFromCart; window.__setQty = setQty;

    case "shop": app.innerHTML = viewShop(); break;
    case "product": app.innerHTML = viewProduct(); attachProductHandlers(); return;

/* --------------------------- maatwerk per product --------------------------- */
/* Een doosje is voor iedereen anders. Staat dit aan, dan geeft de klant zelf
   de afmetingen op en volgt de prijs uit volume en printtijd. */
function sizingOf(p){
  const s = p?.sizing;
  if (!s || !s.enabled) return null;
  return {
    def:  s.def  || [80, 60, 40],
    min:  s.min  || [20, 20, 10],
    max:  s.max  || [250, 250, 250],
    solidity: s.solidity ?? 35,     // hoe vol het object is, in procent
    infill: s.infill ?? 20,
    layerHeight: s.layerHeight || "0.20mm",
  };
}
function currentDims(p){
  const s = sizingOf(p);
  if (!s) return null;
  const d = state.__dims || s.def;
  return [0,1,2].map(i => Math.min(s.max[i], Math.max(s.min[i], Math.round(d[i] || s.def[i]))));
}
function sizedEstimate(p){
  const s = sizingOf(p);
  const [L,W,H] = currentDims(p);
  const fil = currentFilament(p);
  return estimate({
    solidVolume: L * W * H * (s.solidity / 100),
    surfaceArea: 2 * (L*W + L*H + W*H),
    heightMm: H,
    infill: s.infill,
    layerHeight: parseFloat(s.layerHeight),
    filamentType: fil ? fil.type : "PLA Basic",
  });
}
/* De prijs die op de pagina en in de winkelwagen geldt. */
function productPrice(p){
  return sizingOf(p) ? sizedEstimate(p).unit : p.price;
}
/* De prijs bij de kleinst toegestane maat — dat is de "vanaf"-prijs. */
function basePriceOf(p){
  const s = sizingOf(p);
  const [L,W,H] = s.min;
  return estimate({
    solidVolume: L * W * H * (s.solidity / 100),
    surfaceArea: 2 * (L*W + L*H + W*H),
    heightMm: H, infill: s.infill,
    layerHeight: parseFloat(s.layerHeight), filamentType: "PLA Basic",
  }).unit;
}
function sizingBlock(p){
  const s = sizingOf(p);
  const d = currentDims(p);
  const labels = ["Lengte", "Breedte", "Hoogte"];
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:10px;">
        <span class="font-display" style="font-size:14px;">Jouw afmetingen</span>
        <span class="muted font-mono" style="font-size:10px;">IN MM</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
        ${labels.map((lab,i)=>`
          <div>
            <label class="field-label">${lab}</label>
            <input type="number" class="dim" data-dim="${i}" value="${d[i]}"
                   min="${s.min[i]}" max="${s.max[i]}" step="1" style="margin-bottom:2px;" />
            <span class="muted font-mono" style="font-size:10px;">${s.min[i]}–${s.max[i]}</span>
          </div>`).join("")}
      </div>
      <p class="muted" style="font-size:11px;margin:10px 0 0;">
        De prijs volgt je maten: meer materiaal en meer printtijd betekent een hogere prijs.
      </p>
    </div>`;
}

/* Welke afwerking krijgt welk glanslaagje op een staal. */
function finishClass(finish){ return finish === "silk" ? "fil-sheen" : finish === "basic" ? "fil-gloss" : ""; }

/* De filamentkeuze voor het geopende product, met terugval op de eerste
   beschikbare kleur zodat er nooit "niets" gekozen staat. */
function currentFilament(p){
  const list = availableFilaments(p);
  if (!list.length) return null;
  return list.find(f => f.id === state.__filament) || list[0];
}
function filamentPicker(p){
  const list = availableFilaments(p);
  if (!list.length){
    return `<div class="fil-block"><p class="muted" style="font-size:13px;margin:0;">Er zijn nog geen filamenten ingeschakeld.</p></div>`;
  }
  const types = filamentTypes(list);
  const chosen = currentFilament(p);
  const activeType = types.includes(state.__filType) ? state.__filType : chosen.type;
  const colors = list.filter(f => f.type === activeType);
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:10px;">
        <span class="font-display" style="font-size:14px;">Filament</span>
        <span class="muted font-mono" style="font-size:10px;">BAMBU LAB</span>
      </div>
      <div class="fil-types">
        ${types.map(t=>`<button class="fil-type ${t===activeType?'active':''}" data-filtype="${esc(t)}">${esc(t)}</button>`).join("")}
      </div>
      <div class="swatches">
        ${colors.map(f=>`
          <button class="swatch ${finishClass(f.finish)} ${f.id===chosen.id?'active':''}"
                  data-fil="${esc(f.id)}" title="${esc(f.name)} — ${esc(f.hex)}"
                  style="background-color:${esc(f.hex)};">
            ${f.id===chosen.id ? `<span class="tick" style="color:${esc(readableOn(f.hex))}">✓</span>` : ``}

function viewProduct(){
  const p = state.selectedProduct;
  if (!p) return `<p class="muted">Product niet gevonden.</p>`;
  const imgs = productImages(p);
  const chosen = currentFilament(p);
  // index 0 is het kleurvoorbeeld, daarna komen de foto's van het product
  const preview = chosen ? filamentPreview(p.shape || "box", chosen.hex, chosen.finish) : null;
  const all = preview ? [preview, ...imgs] : imgs;
  const active = Math.min(state.__gallery || 0, Math.max(0, all.length - 1));
  const showingPreview = preview && active === 0;
  const main = all.length
    ? `<img id="galleryMain" src="${esc(all[active])}" alt="${esc(p.name)}" />`
    : `<span>${esc(p.icon || "📦")}</span>`;
  const strip = all.length > 1 ? `
    <div class="gallery-strip">
      ${all.map((src,i)=>`<button class="${i===active?'active':''}" data-img="${i}"><img src="${esc(src)}" alt="${i===0&&preview?'Kleurvoorbeeld':'Afbeelding '+i}" /></button>`).join("")}

  const specs = [
    ["Materiaal", chosen ? chosen.type : p.material],

    ["Afmetingen", p.dimensions],

    ["Gewicht", p.weight ? p.weight + " g" : ""],

   .map(([k,v]) => `<div class="spec"><span class="label">${esc(k)}</span>${esc(v)}</div>`).join("");

  const sizing = sizingOf(p);
  const est = sizing ? sizedEstimate(p) : null;
  const inStock = sizing ? true : (p.stock ?? 0) > 0;   // op maat wordt altijd geprint
  return `
    <div style="padding:32px 0;">
      <button class="back" onclick="go('shop')">← Terug naar collectie</button>
      <div class="product-layout">
        <div>
          <div class="gallery-main rel">
            ${main}
            ${showingPreview ? `<span class="preview-note">KLEURVOORBEELD · ${esc(chosen.name.toUpperCase())}</span>` : ``}
          </div>
          ${strip}
        </div>
        <div>
          ${p.category ? `<span class="cat-badge">${esc(p.category)}</span>` : ``}
          <h1 class="font-display" style="font-size:24px;margin:0 0 10px;">${esc(p.name)}</h1>
          <p class="price" style="font-size:26px;margin:0 0 4px;">${fmtEUR(productPrice(p))}</p>
          <p style="font-size:12px;margin:0 0 16px;" class="muted">
            ${sizing
              ? `<span class="stock-dot" style="background:var(--teal)"></span>Op maat geprint`
              : `<span class="stock-dot" style="background:${inStock ? 'var(--teal)' : 'var(--muted)'}"></span>${inStock ? esc(p.stock) + " op voorraad" : "Niet op voorraad"}`}
          </p>
          ${p.description ? `<p style="font-size:14px;line-height:1.6;color:var(--text);opacity:.85;">${esc(p.description)}</p>` : ``}
          ${sizing ? sizingBlock(p) : ``}
          ${filamentPicker(p)}
          ${est ? priceBreakdown(est) : ``}
          ${specs ? `<div class="spec-grid">${specs}</div>` : ``}
          <div class="row" style="margin-top:18px;">
            <div class="stepper"><button id="qMinus">−</button><span id="qVal">1</span><button id="qPlus">+</button></div>
            <button class="btn btn-orange" id="addBtn" ${inStock ? "" : "disabled style=\"opacity:.5;\""}>🛒 Toevoegen</button>
          </div>
          <p class="footer-note">🖨 Wordt op bestelling geprint — verzending binnen 3 tot 5 werkdagen.</p>
        </div>
      </div>

function attachProductHandlers(){

  document.getElementById('qPlus').onclick = ()=>{ qty++; qv.textContent=qty; };
  document.querySelectorAll('[data-img]').forEach(btn=>{
    btn.onclick = () => { state.__gallery = parseInt(btn.dataset.img,10) || 0; render(); };
  });
  document.querySelectorAll('[data-filtype]').forEach(btn=>{
    btn.onclick = () => {
      state.__filType = btn.dataset.filtype;
      // eerste kleur van het nieuwe type kiezen, anders blijft de oude staan
      const first = availableFilaments(state.selectedProduct).find(f => f.type === state.__filType);
      if (first) state.__filament = first.id;
      state.__gallery = 0;
      render();
    };
  });
  document.querySelectorAll('[data-fil]').forEach(btn=>{
    btn.onclick = () => {
      state.__filament = btn.dataset.fil;

      render();
    };
  });
  document.querySelectorAll('.dim').forEach(inp=>{

    addToCart({

      id: [p.id, f?.id, dims?.join("x")].filter(Boolean).join("::"),
      productId: p.id,
      kind: "product", name: p.name, price: est ? est.unit : p.price, qty,
      dims, printTime: est ? Math.round(est.seconds) : null, grams: est ? +est.grams.toFixed(1) : null,
      filament: f ? { id:f.id, type:f.type, name:f.name, hex:f.hex, finish:f.finish } : null,
    });

}

/* Wat we uit het bestand hebben gehaald, plus de knoppen die de prijs sturen. */

  const g = state.__geo;

  const dim = g.size.map(v => Math.round(v * s / 100));
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:10px;">
        <span class="font-display" style="font-size:14px;">Uit je bestand gelezen</span>
        <span class="muted font-mono" style="font-size:10px;">${g.triangles.toLocaleString('nl-BE')} DRIEHOEKEN</span>
      </div>
      <div class="kv"><span>Afmetingen</span><span class="font-mono">${dim[0]} × ${dim[1]} × ${dim[2]} mm</span></div>
      <div class="kv"><span>Modelvolume</span><span class="font-mono">${(g.volume * Math.pow(s/100,3) / 1000).toFixed(1)} cm³</span></div>

      <label class="field-label" style="margin-top:12px;">Schaal — ${s}%</label>
      <input type="range" id="scaleRange" min="25" max="300" step="5" value="${s}" style="width:100%;margin-bottom:10px;" />

      <div class="form-grid">

          </select>
        </div>
        <div>
          <label class="field-label">Laaghoogte</label>

/* De prijs met zijn opbouw erbij, zodat een klant ziet waar het geld heen gaat. */
function priceBreakdown(est){
  return `
    <div class="fil-block">
      <div class="between" style="margin-bottom:8px;">
        <span class="font-display" style="font-size:14px;">Berekende prijs</span>
        <span class="price" style="font-size:22px;">${fmtEUR(est.unit)}</span>
      </div>
      <div class="kv"><span>Filament</span><span class="font-mono">${est.grams.toFixed(1)} g · ${fmtEUR(est.materialCost)}</span></div>
      <div class="kv"><span>Printtijd</span><span class="font-mono">${fmtDuration(est.seconds)} · ${fmtEUR(est.machineCost)}</span></div>
      <div class="kv"><span>Voorbereiding</span><span class="font-mono">${fmtEUR(pricing().setupFee)}</span></div>
      <p class="muted" style="font-size:11px;margin:8px 0 0;">
        Automatisch berekend uit het volume en de printtijd. Bij een bijzondere vorm die veel steunmateriaal vraagt, kan de shop dit nog bijstellen.
      </p>
    </div>`;
}

function customEstimate(){
  const g = state.__geo;
  const s = (state.__scale || 100) / 100;
  const fil = currentFilament(null);
  return estimate({
    solidVolume: g.volume * Math.pow(s, 3),
    surfaceArea: g.surface * Math.pow(s, 2),
    heightMm: g.size[2] * s,
    infill: state.__infill || 20,
    layerHeight: parseFloat(state.__layer || "0.20"),
    filamentType: fil ? fil.type : "PLA Basic",
  });
}
let __customFile = null;
function attachCustomHandlers(){
  // de filamentkiezer werkt hier hetzelfde als op een productpagina
  document.querySelectorAll('[data-filtype]').forEach(btn=>{
    btn.onclick = () => {
      state.__filType = btn.dataset.filtype;
      const first = availableFilaments(null).find(f => f.type === state.__filType);
      if (first) state.__filament = first.id;
      render();
    };
  });
  document.querySelectorAll('[data-fil]').forEach(btn=>{
    btn.onclick = () => { state.__filament = btn.dataset.fil; render(); };
  });

  const notes = document.getElementById('customNotes');
  if (notes) notes.oninput = () => { state.__customNotes = notes.value; };

  const scale = document.getElementById('scaleRange');
  if (scale) scale.oninput = () => { state.__scale = parseInt(scale.value,10); render(); };
  const infill = document.getElementById('customInfill');
  if (infill) infill.onchange = () => { state.__infill = parseInt(infill.value,10); render(); };
  const layer = document.getElementById('customLayer');
  if (layer) layer.onchange = () => { state.__layer = layer.value; render(); };

  const input = document.getElementById('fileInput');
  input.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (!/\.(stl|obj|3mf)$/i.test(f.name)){ notify(`"${f.name}" is geen .stl, .obj of .3mf bestand`); return; }
    if (f.size > MAX_UPLOAD_BYTES){
      notify(`Bestand te groot (${(f.size/1024/1024).toFixed(1)}MB, max ${MAX_UPLOAD_BYTES/1024/1024}MB)`); return;
    }
    __customFile = f;
    state.__geo = null; state.__geoError = null; state.__geoBusy = true;
    state.__scale = 100;
    render();

    // .obj en .3mf kunnen we niet uitlezen; daarvoor blijft de shop handmatig prijzen
    if (!/\.stl$/i.test(f.name)){
      state.__geoBusy = false;
      state.__geoError = "Van .obj en .3mf kunnen we de afmetingen niet automatisch lezen. Voeg het toch toe — we sturen je een prijs zodra we het bekeken hebben.";
      render();
      return;
    }
    try{
      const geo = parseStl(await f.arrayBuffer());
      if (!geo || !geo.volume) throw new Error("Geen bruikbare vorm gevonden in het bestand");
      state.__geo = geo;
    }catch(err){
      state.__geoError = "Kon het model niet uitlezen: " + (err.message || err);
    }finally{
      state.__geoBusy = false;
      render();
    }
  };

  const addBtn = document.getElementById('customAddBtn');
  if (addBtn && __customFile) addBtn.onclick = async () => {
    const f = __customFile;
    if (!state.user){ notify("Log in om een eigen model te uploaden"); go("login"); return; }
    addBtn.disabled = true; addBtn.textContent = "Uploaden...";
    try{
      const path = `uploads/${state.user.uid}/${Date.now()}_${f.name}`;
      const { getStorage, ref, uploadBytes, getDownloadURL } = await loadStorage();
      const sref = ref(getStorage(app), path);
      await uploadBytes(sref, f);
      const url = await getDownloadURL(sref);
      const fil = currentFilament(null);
      const g = state.__geo;
      const est = g ? customEstimate() : null;
      const s = state.__scale || 100;
      const uploadDoc = await addDoc(collection(db,"uploads"), {
        uid: state.user.uid, fileName: f.name, fileSize: f.size,
        material: fil ? fil.type : "", filament: fil ? { id:fil.id, type:fil.type, name:fil.name, hex:fil.hex, finish:fil.finish } : null,
        scalePct: s, infill: state.__infill || 20, layerHeight: state.__layer || "0.20mm",
        geometry: g ? {
          triangles: g.triangles,
          volumeMm3: Math.round(g.volume * Math.pow(s/100,3)),
          sizeMm: g.size.map(v => Math.round(v * s / 100)),
        } : null,
        estimate: est ? { grams: +est.grams.toFixed(1), seconds: Math.round(est.seconds), price: est.unit } : null,
        notes: state.__customNotes || "", storageUrl: url, createdAt: Date.now(),
      });
      addToCart({
        id: uploadDoc.id, kind:"custom",
        name: "Eigen model — " + f.name,
        price: est ? est.unit : 0, qty: 1,
        needsQuote: !est,
        filament: fil ? { id:fil.id, type:fil.type, name:fil.name, hex:fil.hex, finish:fil.finish } : null,
      });
      __customFile = null;
      state.__customNotes = "";
      state.__geo = null;
      go("cart");
    }catch(err){
      const code = err?.code || "";
      let msg = err.message || String(err);
      if (/storage\/unauthorized|storage\/unauthenticated/.test(code)) {
        msg = "Geen toegang tot de opslag — controleer de Storage-regels in Firebase.";
      } else if (/storage\/unknown|storage\/retry-limit|storage\/bucket-not-found|storage\/project-not-found/.test(code)) {
        msg = "De bestandsopslag is nog niet ingesteld in Firebase (Build → Storage).";
      }
      notify("Upload mislukt: " + msg);
      addBtn.disabled = false; addBtn.textContent = "🛒 Toevoegen aan winkelwagen";
    }
  };
}

/* --------------------------- bestellingsopvolging --------------------------- */
const ORDER_STEPS = ["In verwerking", "Wordt geprint", "Verzonden", "Geleverd"];
/* Werkdagen na de bestelling: printen plus verzending, per bestemming. */
const DELIVERY_DAYS = {
  "België": [3, 5], "Nederland": [4, 6], "Duitsland": [4, 7], "Frankrijk": [4, 7],
  "Andere EU-landen": [5, 9], "Buiten de EU": [8, 15],
};
function addWorkingDays(from, days){
  const d = new Date(from);
  let left = days;
  while (left > 0){
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) left--;
  }
  return d;
}
function fmtDate(d){ return d.toLocaleDateString('nl-BE', { day:'numeric', month:'long' }); }
function deliveryWindow(o){
  const [min, max] = DELIVERY_DAYS[o.shippingCountry] || DELIVERY_DAYS["België"];
  return { from: addWorkingDays(o.createdAt, min), to: addWorkingDays(o.createdAt, max) };
}
function orderNumber(o){ return "#" + String(o.id || "").slice(-6).toUpperCase(); }

function orderTracker(o){
  const idx = Math.max(0, ORDER_STEPS.indexOf(o.status));
  return `<div class="track">${ORDER_STEPS.map((s,i)=>`
    <div class="track-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
      <span class="track-dot"></span><span class="track-label">${esc(s)}</span>
    </div>`).join("")}</div>`;
}
function etaLine(o){
  if (o.status === "Geleverd") return `<div class="eta">📦 <strong>Geleverd.</strong> Bedankt voor je bestelling!</div>`;
  const w = deliveryWindow(o);
  const verb = o.status === "Verzonden" ? "Onderweg — verwacht" : "Verwachte levering";
  return `<div class="eta">🚚 ${verb} tussen <strong>${esc(fmtDate(w.from))}</strong> en <strong>${esc(fmtDate(w.to))}</strong></div>`;
}

            ${productRows || `<p class="muted" style="font-size:13px;">Nog geen producten.</p>`}
          </div>
        </div>
      </div>
      <div id="adminOrders" class="${tab==='orders'?'':'hidden'}">
        ${orderRows || `<p class="muted" style="font-size:13px;">Nog geen bestellingen.</p>`}
      </div>
    </div>`;
}
/* --------------------------- beheer: filamenten --------------------------- */
function viewFilamentAdmin(){
  const items = state.filaments || [];
  if (!items.length){
    return `
      <p class="muted" style="font-size:13px;margin-bottom:12px;">De filamentcatalogus is nog niet geladen.</p>
      <button class="btn btn-orange" id="resetFilamentsBtn">Bambu Lab-catalogus laden</button>`;
  }
  const types = filamentTypes(items);
  const blocks = types.map(type => {
    const rows = items.filter(f => f.type === type);
    const aan = rows.filter(f => f.enabled).length;
    return `
      <div class="cart-item" style="margin-bottom:12px;">
        <div class="between" style="margin-bottom:8px;">
          <div>
            <div class="font-display" style="font-size:14px;">${esc(type)}</div>
            <div class="muted font-mono" style="font-size:10px;">${aan} van ${rows.length} aan · ${esc(FILAMENT_FINISHES[rows[0].finish] || rows[0].finish)}</div>
          </div>
          <button class="navbtn" data-filtypetoggle="${esc(type)}" data-target="${aan === rows.length ? 'off' : 'on'}">
            ${aan === rows.length ? "Alles uit" : "Alles aan"}
          </button>
        </div>
        ${rows.map(f=>`
          <div class="fil-row">
            <span class="fil-dot ${finishClass(f.finish)}" style="background-color:${esc(f.hex)};"></span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;${f.enabled?'':'opacity:.45;'}">${esc(f.name)}</div>
              <div class="muted font-mono" style="font-size:10px;">${esc(f.hex.toUpperCase())}</div>
            </div>
            <button class="toggle ${f.enabled?'on':''}" data-filtoggle="${esc(f.id)}" title="${f.enabled?'Uitzetten':'Aanzetten'}"></button>
            ${f.custom ? `<button class="navbtn" data-fildelete="${esc(f.id)}" title="Verwijderen">🗑</button>` : ``}
          </div>`).join("")}
      </div>`;
  }).join("");

  return `
    <p class="muted" style="font-size:13px;margin-bottom:16px;">
      Uitsluitend Bambu Lab. Zet aan wat je op voorraad hebt — klanten zien alleen die kleuren.
      Kleurcodes komen uit de officiële hex-tabellen; je kunt ze hier aanpassen als een kleur eruitziet als iets anders.
    </p>
    ${blocks}
    <div class="cart-item" style="margin-top:16px;">
      <h3 class="font-display" style="font-size:14px;margin:0 0 10px;">+ Eigen filament</h3>
      <div class="form-grid">
        <div><label class="field-label">Type</label><input id="nfType" placeholder="PLA Basic" /></div>
        <div><label class="field-label">Kleurnaam</label><input id="nfName" placeholder="Bambu Green" /></div>
        <div><label class="field-label">Kleurcode</label><input id="nfHex" placeholder="#00AE42" /></div>
        <div><label class="field-label">Afwerking</label>
          <select class="field" id="nfFinish">
            ${Object.entries(FILAMENT_FINISHES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}
          </select>
        </div>
      </div>
      <button class="btn btn-orange" id="addFilamentBtn" style="width:100%;">Filament toevoegen</button>
    </div>`;
}

function attachFilamentHandlers(){
  const reset = document.getElementById('resetFilamentsBtn');
  if (reset) reset.onclick = async () => {
    reset.disabled = true;
    try{ await saveFilaments(buildDefaultFilaments()); notify("Catalogus geladen"); }
    catch(err){ notify("Mislukt: " + err.message); reset.disabled = false; }
  };

  document.querySelectorAll('[data-filtoggle]').forEach(btn=>{
    btn.onclick = async () => {
      const items = (state.filaments || []).map(f =>
        f.id === btn.dataset.filtoggle ? { ...f, enabled: !f.enabled } : f);
      state.filaments = items;                       // meteen zichtbaar
      btn.classList.toggle('on');
      try{ await saveFilaments(items); }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-filtypetoggle]').forEach(btn=>{
    btn.onclick = async () => {
      const on = btn.dataset.target === 'on';
      const items = (state.filaments || []).map(f =>
        f.type === btn.dataset.filtypetoggle ? { ...f, enabled: on } : f);
      try{ await saveFilaments(items); }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-fildelete]').forEach(btn=>{
    btn.onclick = async () => {
      const items = (state.filaments || []).filter(f => f.id !== btn.dataset.fildelete);
      try{ await saveFilaments(items); notify("Filament verwijderd"); }
      catch(err){ notify("Verwijderen mislukt: " + err.message); }
    };
  });

  const add = document.getElementById('addFilamentBtn');
  if (add) add.onclick = async () => {
    const v = id => (document.getElementById(id)?.value || "").trim();
    const type = v('nfType'), name = v('nfName');
    let hex = v('nfHex');
    if (!type || !name){ notify("Vul type en kleurnaam in"); return; }
    if (!hex.startsWith("#")) hex = "#" + hex;
    if (!/^#[0-9a-f]{6}$/i.test(hex)){ notify("Gebruik een kleurcode als #00AE42"); return; }
    const id = slug(type) + "--" + slug(name);
    if ((state.filaments || []).some(f => f.id === id)){ notify("Dat filament staat er al in"); return; }
    const items = [...(state.filaments || []), {
      id, type, name, hex: hex.toUpperCase(), finish: v('nfFinish') || "basic",
      enabled: true, custom: true,
    }];
    try{ await saveFilaments(items); notify("Filament toegevoegd"); }
    catch(err){ notify("Opslaan mislukt: " + err.message); }
  };
}

const MAX_PRODUCT_IMAGES = 4;
window.__deleteProduct = deleteProduct;
window.__setStatus = setOrderStatus;
window.__setAdminTab = (tab) => { state.__adminTab = tab; render(); };
window.__editProduct = (id) => {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  state.__editing = id;
  state.__draftImages = productImages(p).slice();
  state.__adminTab = "products";
  render();
  window.scrollTo(0,0);
};
window.__cancelEdit = () => { state.__editing = null; state.__draftImages = []; render(); };
window.__removeDraftImage = (i) => { state.__draftImages.splice(i,1); renderImageTray(); };

function renderImageTray(){
  const tray = document.getElementById('imgTray');
  if (!tray) return;
  const imgs = state.__draftImages || [];
  tray.innerHTML = imgs.map((src,i)=>`
    <div class="img-slot">
      <img src="${esc(src)}" alt="Afbeelding ${i+1}" />
      <button onclick="window.__removeDraftImage(${i})" title="Verwijderen">×</button>
    </div>`).join("")
    + (imgs.length < MAX_PRODUCT_IMAGES ? `<button class="img-add" id="pickImgBtn" title="Afbeelding kiezen">+</button>` : ``);
  const pick = document.getElementById('pickImgBtn');
  if (pick) pick.onclick = () => document.getElementById('pImgFile').click();
}

/* Leest de maatwerkinstellingen uit het beheerformulier. */
function sizingFromForm(){
  if (!document.getElementById('pSizing')?.checked) return { enabled: false };
  const trio = key => [0,1,2].map(i =>
    parseInt(document.querySelector(`.sz[data-sz="${key}"][data-i="${i}"]`)?.value, 10) || 0);
  const num = (id, d) => { const v = parseInt(document.getElementById(id)?.value, 10); return isFinite(v) ? v : d; };
  return {
    enabled: true,
    def: trio('def'), min: trio('min'), max: trio('max'),
    solidity: Math.min(100, Math.max(1, num('pSolidity', 35))),
    infill: Math.min(100, Math.max(0, num('pSizeInfill', 20))),
    layerHeight: document.getElementById('pSizeLayer')?.value || "0.20mm",
  };
}

function attachAdminHandlers(){
  attachFilamentHandlers();
  const sizingBox = document.getElementById('pSizing');
  if (sizingBox) sizingBox.onchange = () => {
    document.getElementById('sizingFields').classList.toggle('hidden', !sizingBox.checked);
  };
  if (!Array.isArray(state.__draftImages)) state.__draftImages = [];
  renderImageTray();

  const fileInput = document.getElementById('pImgFile');
  if (fileInput) fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of files){
      if ((state.__draftImages || []).length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); break; }
      try{
        state.__draftImages.push(await fileToCompressedDataUrl(f));
        renderImageTray();
      }catch(err){ notify(err.message); }
    }
  };

  const urlBtn = document.getElementById('addImgUrlBtn');
  if (urlBtn) urlBtn.onclick = () => {
    const input = document.getElementById('pImgUrl');
    const url = input.value.trim();
    if (!url) return;
    if (!isSafeImageSrc(url)){ notify("Gebruik een https-adres van een afbeelding"); return; }
    if (state.__draftImages.length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); return; }
    state.__draftImages.push(url);
    input.value = "";
    renderImageTray();
  };

  const btn = document.getElementById('addProductBtn');
  if (btn) btn.onclick = async () => {
    const val = id => (document.getElementById(id)?.value || "").trim();
    const name = val('pName');
    const price = parseFloat(val('pPrice'));
    if (!name){ notify("Vul een naam in"); return; }
    if (!isFinite(price) || price <= 0){ notify("Vul een geldige prijs in"); return; }

    const weight = parseInt(val('pWeight'),10);
    const data = {
      name, price,
      description: val('pDesc'),
      stock: parseInt(val('pStock'),10) || 0,
      category: val('pCategory'),
      color: val('pColor'),
      material: val('pMaterial'),
      infill: val('pInfill') || "20%",
      layerHeight: val('pLayer') || "0.2mm",
      dimensions: val('pDim'),
      printTime: val('pTime'),
      weight: isFinite(weight) ? weight : 0,
      shape: val('pShape') || "box",
      sizing: sizingFromForm(),
      filamentTypes: [...document.querySelectorAll('.ptype:checked')].map(c => c.value),
      featured: !!document.getElementById('pFeatured')?.checked,
      images: (state.__draftImages || []).filter(isSafeImageSrc).slice(0, MAX_PRODUCT_IMAGES),
      icon: "📦",
    };

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Opslaan…";
    try{
      if (state.__editing){
        await updateProduct(state.__editing, data);
        state.__editing = null;
      } else {
        await addProduct(data);
      }
      state.__draftImages = [];
      render();
      window.scrollTo(0,0);
    }catch(err){
      notify("Opslaan mislukt: " + err.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  };
}

/* --------------------------- boot --------------------------- */
seedIfEmpty();
listenProducts();
listenFilaments();
renderAuthNav();
render();
</script>
