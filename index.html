<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LayerCraft — 3D-prints op maat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171b; --surface:#1e2126; --surface2:#262a30;
    --text:#F2F1ED; --muted:#8B8F98; --orange:#FF6B35; --teal:#2EC4B6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .font-display{font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button, select, input, textarea{font-family:'Inter',sans-serif;font-size:14px;}
  button{cursor:pointer;}
  header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--surface2);}
  .header-inner{max-width:960px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text);}
  .brand span{font-size:18px;}
  .navbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:transparent;border:1px solid var(--surface2);color:var(--text);font-size:13px;}
  .navbtn.primary{background:var(--orange);color:#15171b;border:none;font-weight:600;}
  nav{display:flex;align-items:center;gap:8px;}
  #authNav{display:flex;align-items:center;gap:8px;}
  @media(max-width:640px){
    .header-inner{padding:14px 14px;gap:8px;}
    nav{gap:6px;}
    #authNav{gap:6px;}
    .navbtn{padding:8px 10px;}
  }
  main{max-width:960px;margin:0 auto;padding:0 20px 96px;}
  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:32px;padding:48px 0;}
  .hero h1{font-size:32px;line-height:1.2;margin:0 0 12px;}
  .hero p{color:var(--muted);max-width:420px;margin:0 0 20px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:0 0 10px;}
  .layers{position:relative;height:160px;width:160px;flex-shrink:0;}
  .layers-inner{position:absolute;inset:0;display:flex;flex-direction:column-reverse;align-items:center;}
  .layer{height:14px;border-radius:2px;margin-bottom:2px;animation:rise .9s ease-out both;}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0)}}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{text-align:left;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--surface2);color:var(--text);}
  .thumb{width:100%;aspect-ratio:1/1;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .price{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--teal);}
  .muted{color:var(--muted);}

  .spec{background:var(--surface);border:1px solid var(--surface2);border-radius:8px;padding:10px;}

  input, textarea, select.field{width:100%;background:var(--surface);border:1px solid var(--surface2);color:var(--text);border-radius:8px;padding:9px 11px;margin-bottom:10px;}
  label.field-label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .btn{padding:10px 16px;border-radius:8px;border:none;font-weight:600;font-size:14px;}
  .btn-orange{background:var(--orange);color:#15171b;}
  .btn-outline{background:transparent;border:1px solid var(--surface2);color:var(--text);}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .back{background:none;border:none;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px;padding:0;margin-bottom:14px;}

  .badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--teal);}
  .upload-box{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px dashed var(--surface2);border-radius:12px;padding:32px;text-align:center;background:var(--surface);}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}

  .gallery-strip button.active{border-color:var(--teal);}
  .gallery-strip img{width:100%;height:100%;object-fit:cover;display:block;}
  .cat-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:var(--surface2);border-radius:999px;padding:4px 10px;margin-bottom:8px;}
  .card-badge{position:absolute;top:10px;left:10px;font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--orange);color:#15171b;font-weight:700;border-radius:999px;padding:3px 8px;}
  .stock-dot{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:6px;}
  /* --- beheerformulier --- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .img-tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .img-slot{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--surface2);background:var(--surface2);}
  .img-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-slot button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:999px;border:none;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .img-add{width:64px;height:64px;border-radius:8px;border:1.5px dashed var(--surface2);background:var(--surface);color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;}
  .admin-row img{width:44px;height:44px;border-radius:6px;object-fit:cover;display:block;}
  .admin-thumb{width:44px;height:44px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
  /* --- demo-betaling --- */
  .pay-card{background:linear-gradient(135deg,#2a2f36,#1c2025);border:1px solid var(--surface2);border-radius:14px;padding:18px;margin-bottom:16px;}
  .pay-strip{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.14em;margin:14px 0 6px;}
  .demo-banner{background:rgba(255,107,53,.12);border:1px solid var(--orange);color:var(--orange);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:16px;}
  @media(max-width:640px){.hide-sm{display:none;}}
</style>

<header>

<!-- Firebase SDK (modular, v10) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* =====================================================================
   1) Firebase config (Firebase Console > Project settings)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC_CqcZToYO1GMGZ75ThjPi4GBGyNB6Wm0",
  authDomain: "d-printing-shop-fbc7b.firebaseapp.com",
  projectId: "d-printing-shop-fbc7b",
  storageBucket: "d-printing-shop-fbc7b.firebasestorage.app",
  messagingSenderId: "486587768275",
  appId: "1:486587768275:web:5b66b46370d3cc227b2326",
  measurementId: "G-9FLTGE115X",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* --------------------------- constants --------------------------- */
const FIRESTORE_CONSOLE_URL = `https://console.firebase.google.com/project/${firebaseConfig.projectId}/firestore`;
const MAX_UPLOAD_BYTES = 8 * 1024 * 1024; // 8MB (Firebase Storage, not Firestore, so bigger is fine)
const SHIPPING_RATES = [
  { country: "België", price: 4.95 },
  { country: "Nederland", price: 7.95 },
  { country: "Duitsland", price: 7.95 },
  { country: "Frankrijk", price: 7.95 },
  { country: "Andere EU-landen", price: 12.95 },
  { country: "Buiten de EU", price: 24.95 },
];

function fmtEUR(n){ return new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR"}).format(n); }
function notify(msg){
  const t = document.getElementById('toast');
  t.textContent = "✓ " + msg;
  t.classList.remove('hidden');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.add('hidden'), 3000);
}

/* --------------------------- state --------------------------- */
let state = {
  view: "shop",
  products: [],
  productsLoaded: false,
  productsError: null,
  productsStalled: false,
  seedError: null,
  orders: [],
  cart: JSON.parse(sessionStorage.getItem('lc_cart') || "[]"),
  user: null,       // firebase auth user
  profile: null,    // {name, address, isAdmin}
  selectedProduct: null,
};

function saveCart(){ sessionStorage.setItem('lc_cart', JSON.stringify(state.cart)); }
function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }

function go(view, extra){
  state.view = view;
  if (extra) Object.assign(state, extra);
  render();
  window.scrollTo(0,0);
}
window.go = go;

/* --------------------------- auth --------------------------- */
onAuthStateChanged(auth, async (u) => {
  state.user = u;
  if (u) {
    const snap = await getDoc(doc(db, "users", u.uid));
    state.profile = snap.exists() ? snap.data() : null;
    listenOrders();
    listenProducts(); // re-listen (admin sees all)
  } else {
    state.profile = null;
    state.orders = [];
    listenProducts();
  }
  renderAuthNav();
  render();
});

async function doRegister(name, email, password, address){
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const profile = { name, email, address, isAdmin: false, createdAt: Date.now() };
    await setDoc(doc(db, "users", cred.user.uid), profile);
    // onAuthStateChanged leest het profiel al voordat setDoc klaar is, dus zetten we het hier zelf.
    state.profile = profile;
    renderAuthNav();
    notify("Account aangemaakt — welkom " + name);
    go("shop");
  }catch(e){ notify("Fout: " + (e.message || e)); }
}
async function doLogin(email, password){
  try{
    await signInWithEmailAndPassword(auth, email, password);
    notify("Ingelogd");
    go("shop");
  }catch(e){ notify("Fout: " + (e.message || e)); }
}
async function doLogout(){
  await signOut(auth);
  notify("Uitgelogd");
  go("shop");
}

/* --------------------------- products (realtime) --------------------------- */
function listenProducts(){
  const q = query(collection(db, "products"), orderBy("name"));
  // Bestaat de database niet, dan roept Firestore géén foutcallback aan maar
  // blijft het stil opnieuw proberen. Zonder deze timer blijft de shop dan
  // eindeloos op "laden" staan zonder uitleg.
  clearTimeout(state.__productsTimer);
  state.__productsTimer = setTimeout(() => {
    if (!state.productsLoaded){
      state.productsStalled = true;
      if (state.view === "shop") render();
    }
  }, 8000);
  onSnapshot(q, (snap) => {
    clearTimeout(state.__productsTimer);
    state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.productsLoaded = true;
    state.productsError = null;
    state.productsStalled = false;
    if (state.view === "shop" || state.view === "product" || state.view === "admin") render();
  }, (err) => {
    clearTimeout(state.__productsTimer);
    state.productsLoaded = true;
    state.productsError = err;
    state.productsStalled = false;
    render();
  });
}

/* Vertaalt een Firestore-fout naar iets waar je wat mee kunt. */
function firestoreHint(err){
  const code = err?.code || "";
  if (/permission-denied/.test(code))
    return "Firestore weigert toegang. Zet in de Firebase Console de regels op testmodus (Firestore Database → Rules), of controleer of ze niet verlopen zijn — testregels vervallen na 30 dagen.";
  if (/unavailable|failed-precondition|not-found/.test(code))
    return "De database is nog niet aangemaakt. Ga in de Firebase Console naar Build → Firestore Database en klik op Create database.";
  if (/unauthenticated/.test(code))
    return "Firebase herkent de site niet. Controleer of de configuratie bij het juiste project hoort.";
  return err?.message || String(err);
}

/* Bouwt een productafbeelding als SVG: een gestapeld "geprint" object.
   profile(t) geeft de halve breedte terug, t=0 onderaan tot t=1 bovenaan. */
function printSvg(profile, colorA, colorB, bg){
  const rows = 26, top = 72, bottom = 332, h = (bottom - top) / rows;
  let out = "";
  for (let i = 0; i < rows; i++){
    const t = i / (rows - 1);
    const w = Math.max(7, profile(t) * 150);
    const y = bottom - (i + 1) * h;
    out += `<rect x="${(200-w).toFixed(1)}" y="${y.toFixed(1)}" width="${(w*2).toFixed(1)}" height="${(h-2.2).toFixed(1)}" rx="3" fill="${i%2 ? colorB : colorA}" opacity="${(0.58 + 0.42*t).toFixed(2)}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}"/><ellipse cx="200" cy="338" rx="105" ry="12" fill="#000" opacity="0.28"/>${out}</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const PROFILE = {
  vase:  t => 0.34 + 0.30 * Math.sin(Math.PI * t),
  tag:   t => t > 0.80 ? 0.10 : 0.62,
  wedge: t => 0.70 - 0.46 * t,
};

async function seedIfEmpty(){
  try{
    const snap = await getDoc(doc(db, "meta", "seeded_v2"));
    if (snap.exists()) return;
    await writeSeed();
  }catch(err){
    // Stil falen zou een lege collectie opleveren zonder uitleg; de shop toont de reden.
    state.seedError = err;
    if (state.view === "shop") render();
  }
}
async function writeSeed(){
  const seed = [
    {
      name:"Plantenvaas — Spiraal", price:18.0, stock:15, category:"Wonen",
      description:"Waterdichte vaas geprint in vase mode: één doorlopende wand van onder tot boven, zonder naden. De spiraal vangt het licht anders vanuit elke hoek. Geschikt voor droogbloemen of, met een glazen buisje erin, voor water.",
      material:"PETG", infill:"vase mode", layerHeight:"0.16mm", color:"Petrol",
      dimensions:"Ø 90 × 180 mm", printTime:"5u 40m", weight:145, featured:true, icon:"🏺",
      images:[ printSvg(PROFILE.vase,"#2EC4B6","#25a99d","#22262c"), printSvg(PROFILE.vase,"#3ad4c5","#2EC4B6","#1a1d22") ],
    },
    {
      name:"Sleutelhanger — Hex Tag", price:6.5, stock:40, category:"Accessoires",
      description:"Compacte tag met zeshoekig patroon en versterkt ophangoog. Print snel, gaat lang mee, en kan op aanvraag met je eigen initialen in reliëf.",
      material:"PLA", infill:"20%", layerHeight:"0.2mm", color:"Oranje",
      dimensions:"45 × 28 × 4 mm", printTime:"38m", weight:6, featured:false, icon:"🔑",
      images:[ printSvg(PROFILE.tag,"#FF6B35","#e05528","#22262c"), printSvg(PROFILE.tag,"#ff8659","#FF6B35","#1a1d22") ],
    },
    {
      name:"Telefoonstandaard — Wedge", price:9.9, stock:25, category:"Bureau",
      description:"Stevige wig met een uitsparing voor de laadkabel, zodat je toestel opgeladen blijft staan. Past op vrijwel elke telefoon, met of zonder hoesje.",
      material:"PLA+", infill:"35%", layerHeight:"0.2mm", color:"Grijs",
      dimensions:"80 × 70 × 62 mm", printTime:"2u 15m", weight:48, featured:false, icon:"📱",
      images:[ printSvg(PROFILE.wedge,"#c9cdd4","#a8adb6","#22262c"), printSvg(PROFILE.wedge,"#dfe3e9","#c9cdd4","#1a1d22") ],
    },
  ];
  for (const p of seed) await addDoc(collection(db,"products"), { ...p, createdAt: Date.now() });
  await setDoc(doc(db,"meta","seeded_v2"), { done:true });
}

/* --------------------------- orders (realtime) --------------------------- */
let unsubOrders = null;
function listenOrders(){
  if (unsubOrders) unsubOrders();
  if (!state.user) return;
  const base = collection(db, "orders");
  const q = state.profile?.isAdmin
    ? query(base, orderBy("createdAt","desc"))
    : query(base, where("uid","==",state.user.uid), orderBy("createdAt","desc"));
  unsubOrders = onSnapshot(q, (snap) => {
    state.orders = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if (state.view === "account" || state.view === "admin") render();
    // subtle live notification for admin
    if (state.profile?.isAdmin && document.__firstOrderLoad !== false) document.__firstOrderLoad = false;
  }, (err) => notify("Kan bestellingen niet laden: " + err.message));
}

async function placeOrder(shippingCountry, address, payment){
  if (!state.user){ notify("Log in om te bestellen"); go("login"); return; }
  const rate = SHIPPING_RATES.find(r=>r.country===shippingCountry) || SHIPPING_RATES[0];
  const order = {
    uid: state.user.uid,
    userEmail: state.user.email,
    items: state.cart.map(({id,kind,name,price,qty})=>({id,kind,name,price,qty})),
    shippingCountry, shippingAddress: address,
    shippingCost: rate.price,
    subtotal: cartTotal(),
    total: cartTotal() + rate.price,
    status: "In verwerking",
    paymentMethod: payment?.method || "Demo",
    paymentRef: payment?.ref || "",
    demoPayment: true,
    createdAt: Date.now(),
  };
  try{
    await addDoc(collection(db,"orders"), order);
    state.cart = []; saveCart();
    state.__checkout = null;
    notify("Betaald met testgeld — bestelling geplaatst!");
    go("account");
  }catch(e){ notify("Bestellen mislukt: " + e.message); }
}
async function setOrderStatus(orderId, status){
  await updateDoc(doc(db,"orders",orderId), { status });
}

/* --------------------------- products admin --------------------------- */
async function addProduct(p){
  await addDoc(collection(db,"products"), { ...p, createdAt: Date.now() });
  notify("Product toegevoegd");
}
async function updateProduct(id, p){
  await updateDoc(doc(db,"products",id), p);
  notify("Product bijgewerkt");
}
async function deleteProduct(id){
  if (!confirm("Dit product definitief verwijderen?")) return;
  await deleteDoc(doc(db,"products",id));
  notify("Product verwijderd");
}

/* Verkleint een gekozen afbeelding in de browser en geeft een data-URL terug.
   Zo staan productfoto's in het Firestore-document zelf en is Storage niet nodig. */
const IMG_MAX_PX = 1000;
const IMG_MAX_BYTES = 240 * 1024;
function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error("Dat is geen afbeelding"));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Kan het bestand niet lezen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Kan de afbeelding niet openen"));
      img.onload = () => {
        const scale = Math.min(1, IMG_MAX_PX / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = "#22262c";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        let q = 0.82, url = c.toDataURL('image/jpeg', q);
        while (url.length > IMG_MAX_BYTES && q > 0.35){
          q -= 0.12;
          url = c.toDataURL('image/jpeg', q);
        }
        if (url.length > IMG_MAX_BYTES) return reject(new Error("Afbeelding blijft te groot — kies een kleinere"));
        resolve(url);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function isSafeImageSrc(s){ return /^https:\/\//i.test(s) || /^data:image\//i.test(s); }
function productImages(p){ return (Array.isArray(p?.images) ? p.images : []).filter(isSafeImageSrc); }
function productThumb(p, fontSize){
  const imgs = productImages(p);
  return imgs.length
    ? `<img src="${esc(imgs[0])}" alt="${esc(p.name||'')}" loading="lazy" />`
    : `<span style="font-size:${fontSize||32}px;">${esc(p?.icon || "📦")}</span>`;
}

/* --------------------------- cart --------------------------- */
function addToCart(item){
  const existing = state.cart.find(x=>x.id===item.id && x.kind===item.kind);
  if (existing) existing.qty += item.qty; else state.cart.push(item);
  saveCart();
  notify(item.name + " toegevoegd");
  renderCartBadge();
}
function removeFromCart(id,kind){ state.cart = state.cart.filter(x=>!(x.id===id&&x.kind===kind)); saveCart(); render(); }
function setQty(id,kind,qty){ const it=state.cart.find(x=>x.id===id&&x.kind===kind); if(it) it.qty=Math.max(1,qty); saveCart(); render(); }
window.__addToCart = addToCart; window.__removeFromCart = removeFromCart; window.__setQty = setQty;

function renderCartBadge(){
  const b = document.getElementById('cartBadge');
  const c = cartCount();
  if (c>0){ b.textContent=c; b.classList.remove('hidden'); } else b.classList.add('hidden');
}

function esc(s=""){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* --------------------------- render: views --------------------------- */
function render(){
  renderCartBadge();
  const app = document.getElementById('app');
  switch(state.view){
    case "shop": app.innerHTML = viewShop(); break;
    case "product": app.innerHTML = viewProduct(); attachProductHandlers(); return;
    case "custom": app.innerHTML = viewCustom(); attachCustomHandlers(); return;
    case "cart": app.innerHTML = viewCart(); break;
    case "checkout": app.innerHTML = viewCheckout(); attachCheckoutHandlers(); return;
    case "payment": app.innerHTML = viewPayment(); attachPaymentHandlers(); return;
    case "login": app.innerHTML = viewAuth(state.__authMode || "login"); attachAuthHandlers(); return;
    case "account": app.innerHTML = viewAccount(); break;
    case "admin": app.innerHTML = viewAdmin(); attachAdminHandlers(); return;
  }
  attachShopHandlers();
}

/* Een lege collectie heeft altijd een oorzaak — die tonen we in plaats van niets. */
function emptyCollectionNotice(){
  if (!state.productsLoaded && state.productsStalled){
    return `
      <div class="cart-item" style="border-color:var(--orange);">
        <p style="font-size:13px;margin:0 0 8px;color:var(--orange);font-weight:600;">Firestore antwoordt niet</p>
        <p class="muted" style="font-size:13px;margin:0 0 8px;">
          De database is waarschijnlijk nog niet aangemaakt. Firestore meldt dat niet als fout,
          maar blijft het stilletjes opnieuw proberen — daarom bleef dit vak leeg.
        </p>
        <p class="muted" style="font-size:13px;margin:0 0 12px;">
          Ga in de Firebase Console naar <strong>Build → Firestore Database</strong>, klik op
          <strong>Create database</strong>, kies locatie <strong>europe-west1</strong> en
          <strong>Start in test mode</strong>. Herlaad daarna deze pagina.
        </p>
        <a class="btn btn-orange" style="display:inline-block;text-decoration:none;"
           href="${esc(FIRESTORE_CONSOLE_URL)}" target="_blank" rel="noopener">Firestore openen</a>
      </div>`;
  }
  if (!state.productsLoaded && !state.productsError){
    return `<p class="muted" style="font-size:13px;">Collectie laden…</p>`;
  }
  const err = state.productsError || state.seedError;
  if (err){
    return `
      <div class="cart-item" style="border-color:var(--orange);">
        <p style="font-size:13px;margin:0 0 8px;color:var(--orange);font-weight:600;">De collectie kan niet geladen worden</p>
        <p class="muted" style="font-size:13px;margin:0 0 8px;">${esc(firestoreHint(err))}</p>
        <p class="muted font-mono" style="font-size:11px;margin:0;">${esc(err.code || err.message || String(err))}</p>
      </div>`;
  }
  return `
    <div class="cart-item">
      <p style="font-size:13px;margin:0 0 8px;">Er staan nog geen producten in de collectie.</p>
      <p class="muted" style="font-size:13px;margin:0 0 12px;">De drie voorbeeldproducten worden normaal automatisch toegevoegd. Zijn ze verwijderd, of ging dat de eerste keer mis, dan kun je ze hier opnieuw plaatsen.</p>
      <button class="btn btn-orange" id="reseedBtn">Voorbeeldproducten toevoegen</button>
    </div>`;
}
window.__reseed = async (btn) => {
  btn.disabled = true;
  btn.textContent = "Bezig…";
  try{
    await writeSeed();
    state.seedError = null;
    notify("Voorbeeldproducten toegevoegd");
  }catch(err){
    state.seedError = err;
    notify("Mislukt: " + firestoreHint(err));
    render();
  }
};

function attachProductHandlers(){
  let qty = 1;
  const qv = document.getElementById('qVal');
  document.getElementById('qMinus').onclick = ()=>{ qty=Math.max(1,qty-1); qv.textContent=qty; };
  document.getElementById('qPlus').onclick = ()=>{ qty++; qv.textContent=qty; };
  document.querySelectorAll('[data-img]').forEach(btn=>{
    btn.onclick = () => { state.__gallery = parseInt(btn.dataset.img,10) || 0; render(); };

}

let __customFile = null;
function attachCustomHandlers(){
  const input = document.getElementById('fileInput');
  input.onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (!/\.(stl|obj|3mf)$/i.test(f.name)){ notify(`"${f.name}" is geen .stl, .obj of .3mf bestand`); return; }
    if (f.size > MAX_UPLOAD_BYTES){ notify(`Bestand te groot (${(f.size/1024/1024).toFixed(1)}MB, max 8MB)`); return; }
    __customFile = f;
    document.getElementById('fileLabel').textContent = f.name;
    document.getElementById('customForm').classList.remove('hidden');
    const est = Math.max(9.95, 9.95 + (f.size/1024)*0.03);
    document.getElementById('estPrice').textContent = fmtEUR(est);
    document.getElementById('customAddBtn').onclick = async () => {
      if (!state.user){ notify("Log in om een eigen model te uploaden"); go("login"); return; }
      const btn = document.getElementById('customAddBtn');
      btn.disabled = true; btn.textContent = "Uploaden...";
      try{
        const path = `uploads/${state.user.uid}/${Date.now()}_${f.name}`;
        const sref = ref(storage, path);
        await uploadBytes(sref, f);
        const url = await getDownloadURL(sref);
        const material = document.getElementById('customMaterial').value;
        const notes = document.getElementById('customNotes').value;
        const uploadDoc = await addDoc(collection(db,"uploads"), {
          uid: state.user.uid, fileName: f.name, fileSize: f.size,
          material, notes, storageUrl: url, createdAt: Date.now(),
        });
        addToCart({
          id: uploadDoc.id, kind:"custom",
          name: "Eigen model — " + f.name,
          price: Math.round(est*100)/100, qty: 1,
        });
        go("cart");
      }catch(err){
        const code = err?.code || "";
        let msg = err.message || String(err);
        if (/storage\/unauthorized|storage\/unauthenticated/.test(code)) {
          msg = "Geen toegang tot de opslag — controleer de Storage-regels in Firebase.";
        } else if (/storage\/unknown|storage\/retry-limit|storage\/bucket-not-found|storage\/project-not-found/.test(code)) {
          msg = "De bestandsopslag is nog niet ingesteld in Firebase (Build → Storage).";
        }
        notify("Upload mislukt: " + msg);
        btn.disabled = false; btn.textContent = "🛒 Toevoegen aan winkelwagen";
      }
    };
  };
}

        <div class="between" style="border-top:1px solid var(--surface2);margin-top:6px;padding-top:6px;color:var(--teal);"><span>Te betalen</span><span>${fmtEUR(total)}</span></div>
      </div>

      <button class="btn btn-orange" style="width:100%;" id="payBtn">💳 Betaal ${fmtEUR(total)} met testgeld</button>
      <p class="footer-note">🔒 Zodra je echt wilt verkopen, vervangen we deze stap door een echte betaalprovider.</p>
    </div>`;
}
function attachPaymentHandlers(){
  const btn = document.getElementById('payBtn');
  if (!btn) return;
  btn.onclick = async () => {
    const ck = state.__checkout;
    if (!ck) { go("cart"); return; }
    const method = document.getElementById('payMethod').value;
    btn.disabled = true;
    btn.textContent = "Betaling verwerken…";
    // Korte kunstmatige vertraging zodat de flow aanvoelt als een echte betaalpagina.
    await new Promise(r => setTimeout(r, 900));
    await placeOrder(ck.country, ck.address, {
      method,
      ref: "DEMO-" + Math.random().toString(36).slice(2,8).toUpperCase(),
    });
  };
}

function viewAuth(mode){
  return `
    <div style="padding:40px 0;max-width:360px;margin:0 auto;">
      <h1 class="font-display" style="font-size:22px;">${mode==='login'?'Inloggen':'Account aanmaken'}</h1>
      <p class="muted" style="font-size:13px;margin-bottom:20px;">${mode==='login'?'Log in om te bestellen.':'Maak een account om te bestellen.'}</p>
      ${mode==='register' ? `<input id="regName" placeholder="Naam" />` : ``}
      <input id="authEmail" type="email" placeholder="E-mailadres" />
      <input id="authPassword" type="password" placeholder="Wachtwoord (min. 6 tekens)" />
      ${mode==='register' ? `
        <input id="regStreet" placeholder="Straat + nr" />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <input id="regZip" placeholder="Postcode" />
          <input id="regCity" placeholder="Gemeente" />
        </div>` : ``}
      <button class="btn btn-orange" style="width:100%;margin-top:6px;" id="authSubmit">${mode==='login'?'Inloggen':'Account aanmaken'}</button>
      <button class="navbtn" style="width:100%;margin-top:12px;background:none;border:none;color:var(--teal);justify-content:center;" id="authSwitch">
        ${mode==='login' ? 'Nog geen account? Registreer' : 'Al een account? Log in'}
      </button>
    </div>`;
}
function attachAuthHandlers(){
  const mode = state.__authMode || "login";
  document.getElementById('authSwitch').onclick = () => { state.__authMode = mode==='login' ? 'register' : 'login'; render(); };
  document.getElementById('authSubmit').onclick = () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (mode==='login'){ doLogin(email,password); }
    else{
      const name = document.getElementById('regName').value.trim();
      const street = document.getElementById('regStreet').value.trim();
      const zip = document.getElementById('regZip').value.trim();
      const city = document.getElementById('regCity').value.trim();
      doRegister(name, email, password, {street,zip,city});
    }
  };
}

function viewAccount(){
  const orders = state.orders.map(o=>`
    <div class="order-card" style="margin-bottom:10px;">
      <div class="between" style="margin-bottom:6px;">
        <span class="muted font-mono" style="font-size:11px;">${new Date(o.createdAt).toLocaleDateString('nl-BE')}</span>
        <span class="badge">${esc(o.status)}</span>
      </div>
      <div style="font-size:13px;margin-bottom:6px;">${o.items.map(i=>esc(i.name)).join(", ")}</div>
      <div class="between font-mono" style="font-size:13px;"><span class="muted">Naar ${esc(o.shippingCountry)}</span><span>${fmtEUR(o.total)}</span></div>
    </div>`).join("");
  return `
    <div style="padding:32px 0;max-width:480px;">
      <h1 class="font-display" style="font-size:22px;">Hallo, ${esc(state.profile?.name||'')}</h1>
      <p class="muted" style="font-size:13px;margin-bottom:20px;">${esc(state.user?.email||'')}</p>
      <h2 class="font-display" style="font-size:16px;margin-bottom:10px;">Mijn bestellingen</h2>
      ${orders || `<p class="muted" style="font-size:13px;">Nog geen bestellingen.</p>`}
      <button class="navbtn" style="margin-top:16px;color:var(--orange);border:none;background:none;" onclick="go('shop')">← Terug naar de shop</button>
    </div>`;
}

function viewAdmin(){
  const tab = state.__adminTab || "products";
  const ed = state.__editing ? state.products.find(p => p.id === state.__editing) : null;
  const productRows = state.products.map(p=>`
    <div class="admin-row between" style="margin-bottom:8px;${p.id===state.__editing?'border-color:var(--teal);':''}">
      <div class="row" style="flex:1;min-width:0;">
        <div class="admin-thumb">${productThumb(p, 18)}</div>
        <div style="min-width:0;">
          <div style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.name)}</div>
          <div class="muted font-mono" style="font-size:11px;">${fmtEUR(p.price)} · voorraad ${esc(p.stock ?? 0)}${p.category ? " · " + esc(p.category) : ""}</div>
        </div>
      </div>
      <div class="row" style="flex-shrink:0;gap:6px;">
        <button class="navbtn" onclick="window.__editProduct('${p.id}')" title="Bewerken">✎</button>
        <button class="navbtn" onclick="window.__deleteProduct('${p.id}')" title="Verwijderen">🗑</button>
      </div>
    </div>`).join("");
  const orderRows = state.orders.map(o=>`
    <div class="admin-row" style="margin-bottom:10px;">
      <div class="between" style="margin-bottom:6px;">
        <div><div style="font-size:13px;font-weight:600;">${esc(o.userEmail)}</div><div class="muted font-mono" style="font-size:11px;">${new Date(o.createdAt).toLocaleString('nl-BE')}</div></div>
        <select class="field" style="width:auto;margin:0;padding:5px 8px;font-size:12px;" onchange="window.__setStatus('${o.id}',this.value)">
          ${["In verwerking","Wordt geprint","Verzonden","Geleverd"].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join("")}
        </select>
      </div>
      <div style="font-size:13px;margin-bottom:4px;">${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(", ")}</div>
      <div class="between font-mono" style="font-size:11px;">
        <span class="muted">${esc(o.shippingAddress?.street||'')}, ${esc(o.shippingAddress?.zip||'')} ${esc(o.shippingAddress?.city||'')}, ${esc(o.shippingCountry||'')}</span>
        <span style="color:var(--teal);">${fmtEUR(o.total)}</span>
      </div>
      ${o.paymentMethod ? `<div class="muted font-mono" style="font-size:10px;margin-top:4px;">${esc(o.paymentMethod)}${o.paymentRef ? " · " + esc(o.paymentRef) : ""}${o.demoPayment ? " · TESTGELD" : ""}</div>` : ``}
    </div>`).join("");
  return `
    <div style="padding:32px 0;">
      <h1 class="font-display" style="font-size:22px;">⚙ Shopbeheer</h1>
      <p class="muted" style="font-size:13px;margin-bottom:20px;">Voeg producten toe en beheer bestellingen — live gedeeld met iedereen.</p>
      <div class="tabs">
        <button class="tab ${tab==='products'?'active':''}" onclick="window.__setAdminTab('products')">Producten</button>
        <button class="tab ${tab==='orders'?'active':''}" onclick="window.__setAdminTab('orders')">Bestellingen (${state.orders.length})</button>
      </div>
      <div id="adminProducts" class="${tab==='products'?'':'hidden'}">
        <div style="display:grid;grid-template-columns:1fr;gap:24px;">
          <div>
            <div class="between" style="margin-bottom:10px;">
              <h2 class="font-display" style="font-size:15px;margin:0;">${ed ? "✎ Product bewerken" : "+ Nieuw product"}</h2>
              ${ed ? `<button class="navbtn" onclick="window.__cancelEdit()">Annuleren</button>` : ``}
            </div>

            <label class="field-label">Afbeeldingen (max ${MAX_PRODUCT_IMAGES})</label>
            <div class="img-tray" id="imgTray"></div>
            <input type="file" id="pImgFile" accept="image/*" multiple style="display:none;" />
            <div class="row" style="margin-bottom:12px;">
              <input id="pImgUrl" placeholder="…of plak een afbeeldings-URL (https://)" style="margin:0;" />
              <button class="navbtn" id="addImgUrlBtn" style="flex-shrink:0;">Toevoegen</button>
            </div>

            <label class="field-label">Naam</label>
            <input id="pName" placeholder="Bijv. Plantenvaas — Spiraal" value="${esc(ed?.name || '')}" />

            <label class="field-label">Beschrijving</label>
            <textarea id="pDesc" rows="3" placeholder="Waar is het voor, hoe is het geprint, waarom is het leuk?">${esc(ed?.description || '')}</textarea>

            <div class="form-grid">
              <div>
                <label class="field-label">Prijs (€)</label>
                <input id="pPrice" type="number" step="0.01" min="0" placeholder="18.00" value="${ed?.price ?? ''}" />
              </div>
              <div>
                <label class="field-label">Voorraad</label>
                <input id="pStock" type="number" min="0" placeholder="10" value="${ed?.stock ?? 10}" />
              </div>
              <div>
                <label class="field-label">Categorie</label>
                <input id="pCategory" placeholder="Wonen, Bureau, …" value="${esc(ed?.category || '')}" />
              </div>
              <div>
                <label class="field-label">Kleur</label>
                <input id="pColor" placeholder="Petrol" value="${esc(ed?.color || '')}" />
              </div>
              <div>
                <label class="field-label">Materiaal</label>
                <select class="field" id="pMaterial">
                  ${["PLA","PLA+","PETG","ABS","TPU"].map(m=>`<option ${m===(ed?.material||'PLA')?'selected':''}>${m}</option>`).join("")}
                </select>
              </div>
              <div>
                <label class="field-label">Infill</label>
                <input id="pInfill" placeholder="20%" value="${esc(ed?.infill || '20%')}" />
              </div>
              <div>
                <label class="field-label">Laaghoogte</label>
                <input id="pLayer" placeholder="0.2mm" value="${esc(ed?.layerHeight || '0.2mm')}" />
              </div>
              <div>
                <label class="field-label">Afmetingen</label>
                <input id="pDim" placeholder="80 × 70 × 62 mm" value="${esc(ed?.dimensions || '')}" />
              </div>
              <div>
                <label class="field-label">Printtijd</label>
                <input id="pTime" placeholder="2u 15m" value="${esc(ed?.printTime || '')}" />
              </div>
              <div>
                <label class="field-label">Gewicht (g)</label>
                <input id="pWeight" type="number" min="0" placeholder="48" value="${ed?.weight ?? ''}" />
              </div>
            </div>

            <label class="checkbox-row"><input type="checkbox" id="pFeatured" style="width:auto;margin:0;" ${ed?.featured ? 'checked' : ''} /> Uitlichten in de collectie</label>

            <button class="btn btn-orange" id="addProductBtn" style="width:100%;">${ed ? "Wijzigingen opslaan" : "Product toevoegen"}</button>
          </div>
          <div>
            <h2 class="font-display" style="font-size:15px;margin-bottom:10px;">Huidige producten (${state.products.length})</h2>
            ${productRows || `<p class="muted" style="font-size:13px;">Nog geen producten.</p>`}
          </div>
        </div>
      </div>
      <div id="adminOrders" class="${tab==='orders'?'':'hidden'}">
        ${orderRows || `<p class="muted" style="font-size:13px;">Nog geen bestellingen.</p>`}
      </div>
    </div>`;
}
const MAX_PRODUCT_IMAGES = 4;
window.__deleteProduct = deleteProduct;
window.__setStatus = setOrderStatus;
window.__setAdminTab = (tab) => { state.__adminTab = tab; render(); };
window.__editProduct = (id) => {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  state.__editing = id;
  state.__draftImages = productImages(p).slice();
  state.__adminTab = "products";
  render();
  window.scrollTo(0,0);
};
window.__cancelEdit = () => { state.__editing = null; state.__draftImages = []; render(); };
window.__removeDraftImage = (i) => { state.__draftImages.splice(i,1); renderImageTray(); };

function renderImageTray(){
  const tray = document.getElementById('imgTray');
  if (!tray) return;
  const imgs = state.__draftImages || [];
  tray.innerHTML = imgs.map((src,i)=>`
    <div class="img-slot">
      <img src="${esc(src)}" alt="Afbeelding ${i+1}" />
      <button onclick="window.__removeDraftImage(${i})" title="Verwijderen">×</button>
    </div>`).join("")
    + (imgs.length < MAX_PRODUCT_IMAGES ? `<button class="img-add" id="pickImgBtn" title="Afbeelding kiezen">+</button>` : ``);
  const pick = document.getElementById('pickImgBtn');
  if (pick) pick.onclick = () => document.getElementById('pImgFile').click();
}

function attachAdminHandlers(){
  if (!Array.isArray(state.__draftImages)) state.__draftImages = [];
  renderImageTray();

  const fileInput = document.getElementById('pImgFile');
  if (fileInput) fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of files){
      if ((state.__draftImages || []).length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); break; }
      try{
        state.__draftImages.push(await fileToCompressedDataUrl(f));
        renderImageTray();
      }catch(err){ notify(err.message); }
    }
  };

  const urlBtn = document.getElementById('addImgUrlBtn');
  if (urlBtn) urlBtn.onclick = () => {
    const input = document.getElementById('pImgUrl');
    const url = input.value.trim();
    if (!url) return;
    if (!isSafeImageSrc(url)){ notify("Gebruik een https-adres van een afbeelding"); return; }
    if (state.__draftImages.length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); return; }
    state.__draftImages.push(url);
    input.value = "";
    renderImageTray();
  };

  const btn = document.getElementById('addProductBtn');
  if (btn) btn.onclick = async () => {
    const val = id => (document.getElementById(id)?.value || "").trim();
    const name = val('pName');
    const price = parseFloat(val('pPrice'));
    if (!name){ notify("Vul een naam in"); return; }
    if (!isFinite(price) || price <= 0){ notify("Vul een geldige prijs in"); return; }

    const weight = parseInt(val('pWeight'),10);
    const data = {
      name, price,
      description: val('pDesc'),
      stock: parseInt(val('pStock'),10) || 0,
      category: val('pCategory'),
      color: val('pColor'),
      material: val('pMaterial'),
      infill: val('pInfill') || "20%",
      layerHeight: val('pLayer') || "0.2mm",
      dimensions: val('pDim'),
      printTime: val('pTime'),
      weight: isFinite(weight) ? weight : 0,
      featured: !!document.getElementById('pFeatured')?.checked,
      images: (state.__draftImages || []).filter(isSafeImageSrc).slice(0, MAX_PRODUCT_IMAGES),
      icon: "📦",
    };

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Opslaan…";
    try{
      if (state.__editing){
        await updateProduct(state.__editing, data);
        state.__editing = null;
      } else {
        await addProduct(data);
      }
      state.__draftImages = [];
      render();
      window.scrollTo(0,0);
    }catch(err){
      notify("Opslaan mislukt: " + err.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  };
}

/* --------------------------- boot --------------------------- */
seedIfEmpty();
listenProducts();
renderAuthNav();
render();
</script>
