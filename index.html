/* Haalt het 3D-voorbeeld op als het er nog niet is, en tekent het in de kleuren
   die op dit moment gekozen staan. Onderdeel 1 krijgt de kleur van vak 1,
   onderdeel 2 die van vak 2; bij een model in één kleur krijgt alles dezelfde. */
async function toon3dVoorbeeld(){
  const p = state.selectedProduct;
  if (!p) return;
  if (state.__voorbeeld?.id !== p.id){
    const data = await haalVoorbeeld(p.id);
    // ondertussen kan iemand al doorgeklikt zijn
    if (state.selectedProduct?.id !== p.id) return;
    state.__voorbeeld = { id: p.id, data };
    if (data) { render(); return; }          // opnieuw tekenen, nu mét het model
  }
  const v = state.__voorbeeld.data;
  const cv = document.getElementById('productMesh');
  if (!v || !cv) return;

  if (!state.__meshView) state.__meshView = { yaw: 0.7, pitch: 0.42 };
  const meshes = v.__meshes || (v.__meshes = voorbeeldNaarMeshes(v));
  const vakken = colorSlots(p);
  const kleuren = vakken.length
    ? vakken.map((_, i) => slotFilament(p, i) || currentFilament(p) || {})
    : [currentFilament(p) || { hex: "#B8BCC2", finish: "basic" }];

  const teken = () => drawModel(cv, meshes, kleuren, {
    center: [v.min[0] + v.size[0]/2, v.min[1] + v.size[1]/2, 0],
    size: v.size, minZ: v.min[2],
    yaw: state.__meshView.yaw, pitch: state.__meshView.pitch,
  });
  teken();
  requestAnimationFrame(teken);              // na het uitmeten van het vak

  let slepen = false, lx = 0, ly = 0;
  cv.onpointerdown = (e) => { slepen = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => {
    if (!slepen) return;
    state.__meshView.yaw += (e.clientX - lx) * 0.011;
    state.__meshView.pitch = Math.max(-1.3, Math.min(1.4, state.__meshView.pitch + (e.clientY - ly) * 0.009));
    lx = e.clientX; ly = e.clientY;
    teken();
  };
  cv.onpointerup = cv.onpointercancel = () => { slepen = false; };
}

function attachProductHandlers(){
  let qty = 1;
  const qv = document.getElementById('qVal');
  // Vlak na een herlaadbeurt zijn de producten er nog niet en staat er alleen
  // een melding; dan valt er ook niets aan te haken.
  if (!qv) return;
  const maxQty = () => { const r = stockLeft(state.selectedProduct); return isFinite(r) ? Math.max(1, r) : 999; };
  document.getElementById('qMinus').onclick = ()=>{ qty=Math.max(1,qty-1); qv.textContent=qty; };
  document.getElementById('qPlus').onclick = ()=>{
    if (qty >= maxQty()){ notify(`Er zijn er nog maar ${maxQty()} beschikbaar`); return; }
    qty++; qv.textContent=qty;
  };
  document.querySelectorAll('[data-img]').forEach(btn=>{
    btn.onclick = () => { state.__gallery = parseInt(btn.dataset.img,10) || 0; render(); };
  });
  document.querySelectorAll('[data-toon]').forEach(btn=>{
    btn.onclick = () => { state.__toon3d = btn.dataset.toon === "3d"; render(); };
  });
  toon3dVoorbeeld();
  document.querySelectorAll('[data-filtype]').forEach(btn=>{
    btn.onclick = () => {
      state.__filType = btn.dataset.filtype;
      // eerste kleur van het nieuwe type kiezen, anders blijft de oude staan
      const first = availableFilaments(state.selectedProduct).find(f => f.type === state.__filType);
      if (first) state.__filament = first.id;
      state.__gallery = 0;
      render();
    };
  });
  document.querySelectorAll('[data-slot]').forEach(btn=>{
    btn.onclick = () => {
      const i = parseInt(btn.dataset.slot, 10);
      state.__openSlot = state.__openSlot === i ? -1 : i;
      state.__slotType = null;
      render();
    };
  });
  document.querySelectorAll('[data-slottype]').forEach(btn=>{
    btn.onclick = () => { state.__slotType = btn.dataset.slottype; render(); };
  });
  document.querySelectorAll('[data-fil]').forEach(btn=>{
    btn.onclick = () => {
      if (btn.dataset.slotfil !== undefined){
        state.__slotFil = { ...(state.__slotFil || {}), [parseInt(btn.dataset.slotfil,10)]: btn.dataset.fil };
      } else {
        state.__filament = btn.dataset.fil;
      }
      state.__gallery = 0; // toon meteen het kleurvoorbeeld
      render();
    };
  });
  document.querySelectorAll('.dim').forEach(inp=>{
    inp.onchange = () => {
      const p = state.selectedProduct;
      const d = (state.__dims || sizingOf(p).def).slice();
      d[parseInt(inp.dataset.dim,10)] = parseFloat(inp.value) || 0;
      state.__dims = d;
      render();
    };
  });
  const add = document.getElementById('addBtn');
  if (add) add.onclick = ()=>{
    const p = state.selectedProduct;
    const slots = colorSlots(p);
    const keuzes = slots.map((s, i) => {
      const x = slotFilament(p, i);
      return { slot: s.name, id: x?.id, type: x?.type, name: x?.name, hex: x?.hex, finish: x?.finish };
    });
    const f = slots.length ? slotFilament(p, 0) : currentFilament(p);
    const rest = stockLeft(p);
    if (rest <= 0){ notify("Dit product is niet meer op voorraad"); return; }
    if (qty > rest){ qty = rest; qv.textContent = qty; notify(`Aangepast naar ${rest} — meer zijn er niet`); }
    const sizing = sizingOf(p);
    const dims = sizing ? currentDims(p) : null;
    const est = sizing ? sizedEstimate(p) : null;
    addToCart({
      // kleur én maat maken de regel uniek, zodat twee varianten niet samensmelten
      id: [p.id, keuzes.length ? keuzes.map(k=>k.id).join("+") : f?.id, dims?.join("x")].filter(Boolean).join("::"),
      productId: p.id,
      kind: "product", name: p.name, qty,
      price: est ? est.unit : Math.round((productPrice(p) + gekozenToeslag(p)) * 100) / 100,
      filamentSurcharge: est ? 0 : gekozenToeslag(p),
      listPrice: est ? null : listPrice(p) + gekozenToeslag(p),
      discountPct: discountOf(p)?.pct || 0,
      dims, printTime: est ? Math.round(est.seconds) : null, grams: est ? +est.grams.toFixed(1) : null,
      filament: f ? { id:f.id, type:f.type, name:f.name, hex:f.hex, finish:f.finish } : null,
      colorChoices: keuzes.length ? keuzes : null,
    });
  };
}

/* =====================================================================
   Eigen model uploaden — meerdere onderdelen in één opdracht.
   Elk onderdeel krijgt een naam, eigen filament en eigen aantal. De prijs
   volgt per onderdeel uit volume en printtijd; assembleren kost extra.
   ===================================================================== */
const UNITS = { mm: 1, cm: 10, inch: 25.4 };

/* =====================================================================
   Een halfafgewerkte opdracht bewaren
   Wie per ongeluk herlaadt, moet zijn bestanden niet opnieuw hoeven kiezen.
   De instellingen zijn klein en gaan naar sessionStorage; de bestanden zelf
   zijn te groot daarvoor en gaan naar IndexedDB, één rij per onderdeel.
   ===================================================================== */
const PARTS_DB = "extrudo", PARTS_STORE = "bestanden";
function partsDb(){
  return new Promise((res, rej) => {
    if (!self.indexedDB) return rej(new Error("geen opslag"));
    const req = indexedDB.open(PARTS_DB, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(PARTS_STORE)) d.createObjectStore(PARTS_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error("opslag niet beschikbaar"));
  });
}
function partsTx(mode, fn){
  return partsDb().then(d => new Promise((res, rej) => {
    const tx = d.transaction(PARTS_STORE, mode);
    const req = fn(tx.objectStore(PARTS_STORE));
    tx.oncomplete = () => res(req?.result);
    tx.onerror = () => rej(tx.error);
  }));
}
const bewaarBestand = (id, blob) => partsTx("readwrite", s => s.put(blob, id)).catch(()=>{});
const leesBestand   = (id)       => partsTx("readonly",  s => s.get(id)).catch(()=>null);
const wisBestand    = (id)       => partsTx("readwrite", s => s.delete(id)).catch(()=>{});
const wisAlleBestanden = ()      => partsTx("readwrite", s => s.clear()).catch(()=>{});

/* De instellingen van elk onderdeel; de zware gegevens blijven eruit. */
function bewaarOpdracht(){
  try{
    const parts = (state.parts || []).map(p => ({
      id: p.id, name: p.name, fileName: p.fileName, fileSize: p.fileSize,
      unit: p.unit, scale: p.scale, infill: p.infill, layer: p.layer,
      filamentId: p.filamentId, qty: p.qty, fromSplit: !!p.fromSplit,
    }));
    if (!parts.length){ sessionStorage.removeItem('lc_parts'); return; }
    sessionStorage.setItem('lc_parts', JSON.stringify({
      parts, assembled: !!state.assembled, notes: state.projectNotes || "", at: Date.now(),
    }));
  }catch(e){}
}
function vergeetOpdracht(){
  sessionStorage.removeItem('lc_parts');
  wisAlleBestanden();
}

/* Haalt een onderbroken opdracht terug en analyseert de bestanden opnieuw. */
let opdrachtHersteld = false;
async function herstelOpdracht(){
  if (opdrachtHersteld) return;
  opdrachtHersteld = true;
  let bewaard;
  try{ bewaard = JSON.parse(sessionStorage.getItem('lc_parts') || "null"); }catch(e){ return; }
  if (!bewaard?.parts?.length) return;

  const terug = [];
  for (const b of bewaard.parts){
    const blob = await leesBestand(b.id);
    if (!blob) continue;                       // bestand weg: dit onderdeel overslaan
    const file = new File([blob], b.fileName, { type: blob.type || "application/octet-stream" });
    terug.push({ ...newPart(file), ...b, file, geo: null, error: null, busy: true });
  }
  if (!terug.length){ vergeetOpdracht(); return; }

  for (const p of terug){
    const n = parseInt(String(p.id).replace(/^p/, ""), 10);
    if (isFinite(n) && n > __partSeq) __partSeq = n;
  }
  state.parts = terug;
  state.assembled = !!bewaard.assembled;
  state.projectNotes = bewaard.notes || "";
  if (state.view === "custom") render();
  await analyseerWachtende();
  notify(`Je opdracht is teruggezet — ${terug.length} ${terug.length > 1 ? "onderdelen" : "onderdeel"}`);
}

function newPart(file){
  return {
    id: "p" + (++__partSeq),
    file,
    name: file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 60),
    fileName: file.name,
    fileSize: file.size,
    unit: "mm", scale: 100, infill: 20, layer: "0.20mm",
    filamentId: null, qty: 1,
    geo: null, error: null, busy: true,
  };
}
let __partSeq = 0;

/* Een 3mf kan zijn eigen kleuren meebrengen. Die zetten we om naar het
   dichtstbijzijnde filament dat jij op voorraad hebt. */
function applyGeoColor(part, geo){
  if (!geo?.colorHex) return;
  const f = nearestFilament(geo.colorHex);
  if (f){ part.filamentId = f.id; part.matchedFrom = geo.colorHex; }
}

/* Splitst een onderdeel in zijn losse stukken. */
window.__splitPart = (id) => {
  const parts = state.parts || [];
  const part = parts.find(p => p.id === id);
  if (!part || !part.splittable) return;
  const pieces = part.splittable;
  const made = pieces.map((g, i) => {
    const naam = `${part.name} ${i + 1}`;
    // elk stuk krijgt zijn eigen bestand, anders download je straks het geheel
    const { file, vereenvoudigd } = deelAlsBestand(g, naam);
    const np = newPart(file);
    np.busy = false;
    np.geo = g;
    np.name = naam;
    np.unit = part.unit; np.scale = part.scale;
    np.infill = part.infill; np.layer = part.layer;
    np.filamentId = part.filamentId;
    np.fromSplit = true;
    np.vereenvoudigd = vereenvoudigd;
    bewaarBestand(np.id, file);
    return np;
  });
  const at = parts.indexOf(part);
  state.parts.splice(at, 1, ...made);
  wisBestand(part.id);
  bewaarOpdracht();
  notify(`Gesplitst in ${made.length} onderdelen`);
  render();
};

/* De vermenigvuldiging van eenheid en schaal samen. */
function partFactor(p){ return (UNITS[p.unit] || 1) * (p.scale / 100); }
function partSize(p){ return p.geo ? p.geo.size.map(v => v * partFactor(p)) : [0,0,0]; }
function partFilament(p){
  const list = availableFilaments(null);
  return list.find(f => f.id === p.filamentId) || list[0] || null;
}
/* Snijdt het onderdeel echt door en onthoudt de uitkomst, want dat werk hoeft
   maar één keer per combinatie van instellingen. */
function partSlice(p){
  const mesh = p.geo?.full;
  if (!mesh || p.geo.decimated) return null;
  const k = partFactor(p);
  const sleutel = `${k}|${p.layer}|${p.infill}|${JSON.stringify(pricing().slicer || {})}`;
  if (p.__sliceKey === sleutel) return p.__slice;
  p.__slice = sliceMesh(mesh, { layerHeight: parseFloat(p.layer), infill: p.infill, scale: k });
  p.__sliceKey = sleutel;
  return p.__slice;
}

function partEstimate(p){
  if (!p.geo) return null;
  const k = partFactor(p);
  const f = partFilament(p);
  const type = f ? f.type : "PLA Basic";
  const sl = partSlice(p);
  if (sl){
    const grams = (sl.volume / 1000) * (FILAMENT_DENSITY[type] || 1.24);
    return {
      volume: sl.volume, sliced: true, layers: sl.layers,
      ...priceFrom({ seconds: sl.seconds, grams, filamentType: type, pricePerKg: f ? f.pricePerKg : undefined }),
    };
  }
  // Terugval voor bestanden die te zwaar waren om helemaal te bewaren.
  return estimate({
    solidVolume: p.geo.volume * Math.pow(k, 3),
    surfaceArea: p.geo.surface * Math.pow(k, 2),
    heightMm: p.geo.size[2] * k,
    infill: p.infill,
    layerHeight: parseFloat(p.layer),
    filamentType: type,
    pricePerKg: f ? f.pricePerKg : undefined,
  });
}

/* Kortingstrappen op het aantal onderdelen, zoals bij een drukkerij. */
function volumeDiscount(totalQty){
  const tiers = pricing().discountTiers || [];
  let pct = 0;
  for (const t of tiers) if (totalQty >= t.from) pct = t.pct;
  return pct;
}

function projectTotals(){
  const parts = state.parts || [];
  const ready = parts.filter(p => p.geo);
  const qty = ready.reduce((s,p) => s + p.qty, 0);
  const subtotal = ready.reduce((s,p) => s + (partEstimate(p)?.unit || 0) * p.qty, 0);
  const pct = volumeDiscount(qty);
  const discount = subtotal * pct / 100;
  const p = pricing();
  const assembly = (state.assembled && ready.length > 1)
    ? p.assemblyBase + p.assemblyPerPart * Math.max(0, ready.length - 1)
    : 0;
  const grams = ready.reduce((s,p) => s + (partEstimate(p)?.grams || 0) * p.qty, 0);
  const seconds = ready.reduce((s,p) => s + (partEstimate(p)?.seconds || 0) * p.qty, 0);
  return {
    parts: ready.length, qty, subtotal, pct, discount, assembly,
    grams, seconds,
    total: Math.max(0, subtotal - discount) + assembly,
    pending: parts.filter(p => p.busy).length,
    failed: parts.filter(p => p.error).length,
    // klopt zolang elk onderdeel echt door de slicer ging
    sliced: ready.length > 0 && ready.every(p => partEstimate(p)?.sliced),
  };
}

/* Hangt de 3D-weergaven aan hun canvas en maakt ze draaibaar met de muis of
   een vinger. De hoek wordt per onderdeel onthouden. */
function attachMeshViewers(){
  document.querySelectorAll('.mesh3d').forEach(cv=>{
    const part = (state.parts || []).find(p => p.id === cv.dataset.mesh);
    if (!part || !part.geo) return;
    const fil = partFilament(part);
    if (!part.view) part.view = { yaw: 0.7, pitch: 0.45 };

    const paint = (ruw) => {
      const opts = {
        hex: fil?.hex || "#B8BCC2", finish: fil?.finish || "basic",
        yaw: part.view.yaw, pitch: part.view.pitch, ruw,
      };
      const sl = part.viewMode === "lagen" ? partSlice(part) : null;
      // de lagen zijn al op ware grootte gesneden, het model nog niet
      if (sl) drawSlices(cv, part.geo, sl, { ...opts, scale: partFactor(part) });
      else drawMesh(cv, part.geo, opts);
    };
    paint(false);
    // na het laden van het lettertype of een resize klopt de maat pas echt
    requestAnimationFrame(() => paint(false));

    let dragging = false, lx = 0, ly = 0, netjes = null;
    cv.onpointerdown = (e) => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = (e) => {
      if (!dragging) return;
      part.view.yaw += (e.clientX - lx) * 0.011;
      part.view.pitch = Math.max(-1.3, Math.min(1.4, part.view.pitch + (e.clientY - ly) * 0.009));
      lx = e.clientX; ly = e.clientY;
      paint(true);                    // tijdens het slepen de lichte versie
    };
    cv.onpointerup = cv.onpointercancel = () => {
      dragging = false;
      clearTimeout(netjes);
      netjes = setTimeout(() => paint(false), 60);   // en daarna weer het echte model
    };
  });
}

/* Kijkt één keer of de opslag bereikbaar is, zodat een klant het vooraf weet
   in plaats van na het invullen van een hele opdracht. */
async function probeStorage(){
  if (state.storageChecked || !state.user) return;
  state.storageChecked = true;
  try{
    const { getStorage, ref, uploadBytesResumable } = await loadStorage();
    const store = getStorage(app);
    store.maxUploadRetryTime = 8000;
    store.maxOperationRetryTime = 6000;
    const probe = ref(store, `uploads/${state.user.uid}/.probe`);
    const task = uploadBytesResumable(probe, new Blob([new Uint8Array(1)]));
    await new Promise((resolve, reject) => {
      const t = setTimeout(() => { try{ task.cancel(); }catch(e){} reject(new Error("timeout")); }, 9000);
      task.on('state_changed', null,
        err => { clearTimeout(t); reject(err); },
        () => { clearTimeout(t); resolve(); });
    });
  }catch(err){
    state.storageDown = true;
    if (state.view === "custom") render();
  }
}

/* Leest elk onderdeel dat nog op analyse wacht. Dezelfde weg voor een vers
   gekozen bestand als voor een teruggezette opdracht na een herlaadbeurt. */
async function analyseerWachtende(){
  for (const part of (state.parts || []).filter(p => p.busy)){
    try{
      if (/\.obj$/i.test(part.fileName)){
        part.error = "Van .obj lezen we de maten niet automatisch — we sturen je een prijs na controle.";
        part.busy = false; render(); continue;
      }
      const geos = await analyzeFile(part.file);
      part.geo = geos[0];
      applyGeoColor(part, geos[0]);
      // een 3mf met meerdere objecten of platen valt meteen uiteen; elk object
      // krijgt zijn eigen bestand zodat je het later los kunt downloaden
      if (geos.length > 1){
        const extra = geos.slice(1).map((g, i) => {
          const naam = g.label || `${part.name} ${i + 2}`;
          const { file, vereenvoudigd } = deelAlsBestand(g, naam);
          const np = newPart(file);
          np.busy = false;
          np.geo = g;
          np.name = naam;
          np.fromSplit = true;
          np.vereenvoudigd = vereenvoudigd;
          applyGeoColor(np, g);
          bewaarBestand(np.id, file);
          return np;
        });
        const eersteNaam = geos[0].label || part.name + " 1";
        const eerste = deelAlsBestand(geos[0], eersteNaam);
        part.file = eerste.file;
        part.fileName = eerste.file.name;
        part.fileSize = eerste.file.size;
        part.vereenvoudigd = eerste.vereenvoudigd;
        bewaarBestand(part.id, eerste.file);
        part.name = eersteNaam;
        part.fromSplit = true;
        const at = state.parts.indexOf(part);
        state.parts.splice(at + 1, 0, ...extra);
        notify(`${geos.length} onderdelen gevonden in ${part.fileName}`);
      } else {
        // één object, maar misschien meerdere losse stukken erin
        part.splittable = splitGeo(geos[0]);
      }
      // meteen doorsnijden, zodat het eerste scherm de prijs al klaar heeft
      partSlice(part);
    }catch(err){
      part.error = "Kon dit bestand niet uitlezen: " + (err.message || err);
    }finally{
      part.busy = false;
      bewaarOpdracht();
      render();
    }
  }
}

function attachCustomHandlers(){
  herstelOpdracht();       // stond er nog een halfafgewerkte opdracht klaar?
  attachMeshViewers();
  probeStorage();
  const input = document.getElementById('fileInput');
  if (input) input.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!Array.isArray(state.parts)) state.parts = [];

    for (const f of files){
      if (state.parts.length >= MAX_PARTS){ notify(`Maximaal ${MAX_PARTS} onderdelen per opdracht`); break; }
      if (!/\.(stl|obj|3mf)$/i.test(f.name)){ notify(`"${f.name}" is geen .stl, .obj of .3mf bestand`); continue; }
      if (f.size > MAX_UPLOAD_BYTES){
        notify(`"${f.name}" is te groot (${(f.size/1024/1024).toFixed(1)}MB, max ${MAX_UPLOAD_BYTES/1024/1024}MB)`); continue;
      }
      state.parts.push(newPart(f));
    }
    render();

    for (const p of state.parts) if (p.file) bewaarBestand(p.id, p.file);
    bewaarOpdracht();
    render();
    await analyseerWachtende();
  };

  document.querySelectorAll('[data-parttype]').forEach(btn=>{
    btn.onclick = () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.parttype);
      if (!part) return;
      // eerste kleur van het nieuwe type kiezen; de rest volgt daaruit
      const eerste = availableFilaments(null).find(f => f.type === btn.dataset.type);
      if (eerste) part.filamentId = eerste.id;
      bewaarOpdracht();
      render();
    };
  });
  document.querySelectorAll('[data-partfil]').forEach(btn=>{
    btn.onclick = () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.partfil);
      if (!part) return;
      part.filamentId = btn.dataset.fil;
      bewaarOpdracht();
      render();
    };
  });

  document.querySelectorAll('.kalibreer').forEach(btn=>{
    btn.onclick = async () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.part);
      const veld = document.querySelector(`.kalmin[data-part="${btn.dataset.part}"]`);
      const echt = parseFloat(veld?.value) * 60;
      const nu = partEstimate(part)?.seconds;
      const s = slicerSettings();
      if (!part || !isFinite(echt) || echt <= 0){ notify("Vul de tijd in minuten in"); return; }
      // De voorbereidingstijd zit in beide getallen; die telt niet mee in de
      // verhouding, anders zou hij dubbel meewegen.
      const onsPrinten = Math.max(1, nu - s.prepSec);
      const echtPrinten = Math.max(1, echt - s.prepSec);
      const nieuw = Math.max(0.2, Math.min(6, (s.timeFactor || 1) * (echtPrinten / onsPrinten)));
      try{
        await savePricing({ ...pricing(), slicer: { ...s, timeFactor: +nieuw.toFixed(3) } });
        part.__sliceKey = null;
        notify(`Afgesteld: correctie ${nieuw.toFixed(2)}× (was ${(s.timeFactor || 1).toFixed(2)}×)`);
        render();
      }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-viewmode]').forEach(btn=>{
    btn.onclick = () => {
      const part = (state.parts || []).find(p => p.id === btn.dataset.viewmode);
      if (!part) return;
      part.viewMode = part.viewMode === "lagen" ? "model" : "lagen";
      render();
    };
  });

  document.querySelectorAll('[data-split]').forEach(btn=>{
    btn.onclick = () => window.__splitPart(btn.dataset.split);
  });

  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = () => {
      state.parts = (state.parts || []).filter(p => p.id !== btn.dataset.remove);
      wisBestand(btn.dataset.remove);
      bewaarOpdracht();
      render();
    };
  });

  document.querySelectorAll('.part-card').forEach(card=>{
    const part = (state.parts || []).find(p => p.id === card.dataset.part);
    if (!part) return;
    card.querySelectorAll('[data-field]').forEach(el=>{
      const apply = () => {
        const f = el.dataset.field;
        if (f === 'name') { part.name = el.value; bewaarOpdracht(); return; }  // geen render: cursor blijft staan
        if (f === 'qty') part.qty = Math.min(999, Math.max(1, parseInt(el.value,10) || 1));
        else if (f === 'scale') part.scale = parseInt(el.value,10) || 100;
        else if (f === 'infill') part.infill = parseInt(el.value,10);
        else if (f === 'unit') part.unit = el.value;
        else if (f === 'layer') part.layer = el.value;
        else if (f === 'filament') part.filamentId = el.value;
        else if (f === 'filtype'){
          const first = availableFilaments(null).find(x => x.type === el.value);
          part.filamentId = first ? first.id : null;
        }
        bewaarOpdracht();
        render();
      };
      if (el.dataset.field === 'name') el.oninput = apply;
      else if (el.type === 'range') el.oninput = apply;
      else el.onchange = apply;
    });
  });

  const box = document.getElementById('assembleBox');
  if (box) box.onchange = () => { state.assembled = box.checked; bewaarOpdracht(); render(); };

  const notes = document.getElementById('projectNotes');
  if (notes) notes.oninput = () => { state.projectNotes = notes.value; bewaarOpdracht(); };

  const add = document.getElementById('addJobBtn');
  if (add) add.onclick = () => addJobToCart(add);
}

async function addJobToCart(btn){
  if (!state.user){ notify("Log in om een eigen model te laten printen"); go("login"); return; }
  const ready = (state.parts || []).filter(p => p.geo);
  if (!ready.length){ notify("Nog geen bruikbaar onderdeel"); return; }
  const t = projectTotals();

  btn.disabled = true;
  const totalBytes = ready.reduce((s, p) => s + p.fileSize, 0);
  let doneBytes = 0;
  const showProgress = (extra) => {
    const pct = totalBytes ? Math.min(100, Math.round((doneBytes + extra) / totalBytes * 100)) : 0;
    btn.innerHTML = `${ic("spinner")} Versturen… ${pct}%`;
  };
  showProgress(0);

  try{
    // Eerst het documenthok aanmaken: de bestanden hangen eronder.
    const jobDoc = await addDoc(collection(db, "uploads"), {
      uid: state.user.uid, createdAt: Date.now(), status: "bezig",
    });

    const useStorage = !state.storageDown;
    let storeApi = null;
    if (useStorage){
      try{
        const api = await loadStorage();
        const store = api.getStorage(app);
        // Firebase probeert een mislukte upload standaard tot tien minuten
        // opnieuw; zo weten we binnen een halve minuut waar we aan toe zijn.
        store.maxUploadRetryTime = 25000;
        store.maxOperationRetryTime = 15000;
        storeApi = { ...api, store };
      }catch(e){ storeApi = null; }
    }

    const uploaded = [];
    for (let i = 0; i < ready.length; i++){
      const part = ready[i];
      showProgress(0);
      let storage = null, url = null;

      if (storeApi){
        try{
          const sref = storeApi.ref(storeApi.store, `uploads/${state.user.uid}/${jobDoc.id}_${i}_${part.fileName}`);
          const task = storeApi.uploadBytesResumable(sref, part.file);
          await new Promise((resolve, reject) => {
            let last = Date.now();
            const watchdog = setInterval(() => {
              if (Date.now() - last > 30000){
                clearInterval(watchdog);
                try{ task.cancel(); }catch(e){}
                reject(Object.assign(new Error("geen antwoord van de opslag"), { code: "storage/retry-limit" }));
              }
            }, 2000);
            task.on("state_changed",
              snap => { last = Date.now(); showProgress(snap.bytesTransferred); },
              err => { clearInterval(watchdog); reject(err); },
              () => { clearInterval(watchdog); resolve(); });
          });
          url = await storeApi.getDownloadURL(sref);
          storage = { kind: "storage" };
        }catch(err){
          // Storage niet beschikbaar: vanaf hier alles via Firestore.
          storeApi = null;
          state.storageDown = true;
        }
      }

      if (!storage){
        storage = await storeFileInFirestore(jobDoc.id, i, part.file, done => showProgress(done));
      }

      doneBytes += part.fileSize;
      showProgress(0);
      const est = partEstimate(part);
      const f = partFilament(part);
      uploaded.push({
        name: part.name || part.fileName,
        fileName: part.fileName, fileSize: part.fileSize,
        storageUrl: url, storage,
        unit: part.unit, scalePct: part.scale, infill: part.infill, layerHeight: part.layer,
        qty: part.qty,
        sizeMm: partSize(part).map(v => Math.round(v)),
        volumeMm3: Math.round(part.geo.volume * Math.pow(partFactor(part), 3)),
        filament: f ? { id:f.id, type:f.type, name:f.name, hex:f.hex, finish:f.finish } : null,
        grams: est ? +est.grams.toFixed(1) : null,
        seconds: est ? Math.round(est.seconds) : null,
        unitPrice: est ? est.unit : null,
        vereenvoudigd: !!part.vereenvoudigd,
      });
    }

    await setDoc(doc(db, "uploads", jobDoc.id), {
      uid: state.user.uid,
      parts: uploaded,
      assembled: !!state.assembled && t.assembly > 0,
      notes: state.projectNotes || "",
      status: "klaar",
      totals: {
        parts: t.parts, qty: t.qty, grams: +t.grams.toFixed(1),
        seconds: Math.round(t.seconds), subtotal: +t.subtotal.toFixed(2),
        discountPct: t.pct, assembly: +t.assembly.toFixed(2), total: +t.total.toFixed(2),
        sliced: !!t.sliced,
      },
      createdAt: Date.now(),
    });

    vergeetOpdracht();
    addToCart({
      id: jobDoc.id, kind: "custom",
      uploadId: jobDoc.id,
      name: uploaded.length === 1
        ? "Eigen model — " + uploaded[0].name
        : `Eigen opdracht — ${uploaded.length} onderdelen`,
      price: Math.round(t.total * 100) / 100,
      qty: 1,
      sliced: !!t.sliced,
      jobParts: uploaded.map((u, i) => ({
        name: u.name, qty: u.qty, filament: u.filament,
        fileName: u.fileName, index: i, storage: u.storage, storageUrl: u.storageUrl,
        vereenvoudigd: !!u.vereenvoudigd,
      })),
      assembled: !!state.assembled && t.assembly > 0,
    });

    state.parts = [];
    state.assembled = false;
    state.projectNotes = "";
    go("cart");
  }catch(err){
    const code = err?.code || "";
    let msg = err.message || String(err);
    if (/storage\/unauthorized|storage\/unauthenticated/.test(code)) {
      msg = "Geen toegang tot de opslag — controleer de Storage-regels in Firebase.";
    } else if (/storage\/retry-limit/.test(code)) {
      msg = "De opslag antwoordt niet. Meestal betekent dat Storage nog niet is ingesteld in Firebase (Build → Storage); anders was je verbinding te traag.";
    } else if (/storage\/unknown|storage\/bucket-not-found|storage\/project-not-found/.test(code)) {
      msg = "De bestandsopslag is nog niet ingesteld in Firebase (Build → Storage).";
    } else if (/storage\/quota-exceeded/.test(code)) {
      msg = "De opslaglimiet van het Firebase-project is bereikt.";
    }
    notify("Uploaden mislukt: " + msg);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-cart-plus" aria-hidden="true"></i> Toevoegen aan winkelwagen';
  }
}

/* De gekozen kleur per benoemd stuk, kort weergegeven. */
/* Wat er in de winkelwagen onder de naam staat: één regel per ding, met een
   kopje ervoor. Vroeger stond dit als één kleine grijze regel naast de
   plusknop geperst — dan valt het weg zodra een naam wat langer is. */
function kleurBol(f, k){
  return `<span class="fil-chip ${finishClass(f.finish)}" style="background-color:${esc(f.hex || "#888")};"></span>
          <span>${esc(k || f.name || "")}</span>`;
}
function wagenSpecs(it){
  const regel = (sleutel, waarde) =>
    `<div class="wagen-spec"><span class="sleutel">${esc(sleutel)}</span><span class="waarde">${waarde}</span></div>`;
  const uit = [];
  const vakken = Array.isArray(it.colorChoices) ? it.colorChoices : [];

  if (vakken.length){
    // een model met benoemde kleurvakken: mond geel, arm blauw. Alleen die
    // vakken tonen — de losse kleur eronder is die van het eerste vak en zou
    // er als een vreemde extra regel boven komen te staan.
    for (const c of vakken){
      uit.push(regel(c.slot || "Kleur",
        kleurBol(c, [c.type, c.name].filter(Boolean).join(" · "))));
    }
  } else if (it.filament){
    // één kleur voor het hele stuk
    if (it.filament.type) uit.push(regel("Materiaal", esc(it.filament.type)));
    uit.push(regel("Kleur", kleurBol(it.filament, it.filament.name)));
  }

  // een eigen opdracht met meerdere onderdelen
  const delen = Array.isArray(it.jobParts) ? it.jobParts : [];
  if (delen.length){
    uit.push(regel("Onderdelen", delen.map(j => `
      <span class="wagen-deel">
        ${j.filament ? `<span class="fil-chip ${finishClass(j.filament.finish)}" style="background-color:${esc(j.filament.hex || "#888")};"></span>` : ``}
        <span>${j.qty}× ${esc(j.name)}${j.filament
          ? ` <span class="muted">— ${esc([j.filament.type, j.filament.name].filter(Boolean).join(" "))}</span>` : ``}</span>
      </span>`).join("")));
    uit.push(regel("Levering", it.assembled ? "In elkaar gezet" : "Los, per onderdeel"));
  }

  // De maat staat er alleen bij als de klant hem zelf gekozen heeft — bij
  // maatwerk dus. Bij een geüpload model staat er geen maat in de regel.
  if (it.dims) uit.push(regel("Maat", esc(it.dims.join(" × ")) + " mm"));
  return uit.join("");
}

/* =====================================================================
   Bestaat dit adres wel?
   Een pakket dat naar een straat gaat die niet bestaat, komt terug. We kijken
   het daarom na vóór het betalen: eerst de vorm (staat er een huisnummer bij,
   klopt de postcode voor dat land), daarna of het adres echt te vinden is in
   OpenStreetMap. Vinden we het niet, dan houden we niemand tegen — nieuwe
   straten staan er soms nog niet in — maar je krijgt wel de vraag of het klopt.
   ===================================================================== */
const POSTCODE_VORM = {
  "België":     { re: /^\d{4}$/,               uitleg: "vier cijfers, bijvoorbeeld 9280" },
  "Nederland":  { re: /^\d{4}\s?[A-Za-z]{2}$/, uitleg: "vier cijfers en twee letters, bijvoorbeeld 1012 AB" },
  "Duitsland":  { re: /^\d{5}$/,               uitleg: "vijf cijfers, bijvoorbeeld 50667" },
  "Frankrijk":  { re: /^\d{5}$/,               uitleg: "vijf cijfers, bijvoorbeeld 75001" },
};
const LANDCODE = { "België": "be", "Nederland": "nl", "Duitsland": "de", "Frankrijk": "fr" };

function adresVorm({ street, zip, city }, land){
  if (!street || !zip || !city) return "Vul je adres volledig in";
  if (!/\d/.test(street)) return "Zet het huisnummer bij de straat";
  const vorm = POSTCODE_VORM[land];
  if (vorm && !vorm.re.test(zip)) return `De postcode van ${land} bestaat uit ${vorm.uitleg}`;
  return null;
}

/* OpenStreetMap kent bijna elk adres en vraagt er niets voor. Lukt het
   opzoeken niet — geen verbinding, dienst plat — dan laten we het gaan: aan
   een klant die niet kan bestellen heeft niemand iets. */
async function zoekAdres({ street, zip, city }, land){
  const p = new URLSearchParams({ format: "jsonv2", limit: "1", addressdetails: "1", street, city });
  if (POSTCODE_VORM[land]) p.set("postalcode", zip);
  if (LANDCODE[land]) p.set("countrycodes", LANDCODE[land]);
  try{
    const res = await fetch("https://nominatim.openstreetmap.org/search?" + p, {
      headers: { "Accept": "application/json" },
    });
    if (!res.ok) return { status: "onbereikbaar" };
    const rij = (await res.json())[0];
    if (!rij) return { status: "onbekend" };
    const a = rij.address || {};
    return {
      status: "gevonden",
      // wat OpenStreetMap ervan maakt; handig als iemand zich vertikt heeft
      gevonden: {
        zip: a.postcode || zip,
        city: a.city || a.town || a.village || a.municipality || city,
      },
    };
  }catch(e){ return { status: "onbereikbaar" }; }
}

/* De momenten waarop je kunt afhalen, gegroepeerd per dag. */
function afhaalBlok(){
  const momenten = afhaalMomenten();

  if (!momenten.length) return `
    <div class="cart-item" style="margin-bottom:14px;">

      </p>

  const perDag = new Map();
  for (const t of momenten){
    const d = new Date(t).toLocaleDateString('nl-BE', { weekday:'long', day:'numeric', month:'long' });

function attachCheckoutHandlers(){
  const ophalen = state.__leverwijze === "afhaal" && afhalen().enabled;
  const sel = document.getElementById('ckCountry');
  const veld = id => document.getElementById(id);
  const lees = () => ({
    street: veld('ckStreet')?.value.trim() || "",
    zip: veld('ckZip')?.value.trim() || "",
    city: veld('ckCity')?.value.trim() || "",
  });

  // verzenden of afhalen
  document.querySelectorAll('[data-lever]').forEach(b => {
    b.onclick = () => {
      state.__leverwijze = b.dataset.lever;
      state.__adresCheck = null;
      render();
    };
  });
  document.querySelectorAll('[data-slot-at]').forEach(b => {
    b.onclick = () => { state.__afhaal = +b.dataset.slotAt; render(); };
  });

  // kortingscode
  const codeBtn = veld('codeBtn');
  if (codeBtn) codeBtn.onclick = async () => {
    const inp = veld('ckCode');
    state.__codeTyped = codeNet(inp.value);
    codeBtn.disabled = true;
    const uit = await zoekCode(state.__codeTyped, cartTotal());
    if (uit.ok){
      state.__korting = uit;
      state.__codeFout = null;
      state.__codeTyped = "";
      notify(`Code ${uit.code} toegepast — ${uit.uitleg}`);
    } else {
      state.__korting = null;
      state.__codeFout = uit.waarom;
    }
    render();
  };
  const wisCode = veld('wisCodeBtn');
  if (wisCode) wisCode.onclick = () => { state.__korting = null; state.__codeFout = null; render(); };

  if (sel){
    const updateTotals = () => {
      const rate = SHIPPING_RATES.find(r=>r.country===sel.value) || SHIPPING_RATES[0];
      veld('ckShipVal').textContent = fmtEUR(rate.price);
      veld('ckTotalVal').textContent = fmtEUR(Math.max(0, cartTotal() - (state.__korting?.bedrag || 0)) + rate.price);
    };
    sel.onchange = () => { state.__ckLand = sel.value; state.__adresCheck = null; updateTotals(); };
    // typ je iets bij, dan geldt een eerder oordeel niet meer
    for (const id of ['ckStreet','ckZip','ckCity']){
      const el = veld(id);
      if (el) el.oninput = () => {
        state.__ckVeld = lees();
        if (state.__adresCheck) { state.__adresCheck = null; render(); }
      };
    }
  }

  const doorGaan = (extra) => {
    state.__checkout = { country: sel?.value || "België", address: state.__ckVeld, ...extra };
    state.__adresCheck = null;
    go("payment");
  };
  const door = veld('tochDoorBtn');
  if (door) door.onclick = () => doorGaan();
  const over = veld('neemOverBtn');
  if (over) over.onclick = () => {
    state.__ckVeld = { ...state.__ckVeld, ...state.__adresCheck.voorstel };
    doorGaan();
  };

  veld('placeOrderBtn').onclick = async () => {
    // afhalen: geen adres nodig, wel een moment
    if (ophalen){
      if (!state.__afhaal){ notify("Kies een moment om af te halen"); return; }
      if (!afhaalMomenten().includes(state.__afhaal)){
        state.__afhaal = null;
        notify("Dat moment kan niet meer — kies een ander");
        render();
        return;
      }
      doorGaan({ pickupAt: state.__afhaal });
      return;
    }

    const adres = lees();
    state.__ckVeld = adres;
    state.__ckLand = sel.value;
    const fout = adresVorm(adres, sel.value);
    if (fout){ notify(fout); return; }

    state.__adresCheck = { bezig: true };
    render();
    const uitslag = await zoekAdres(adres, sel.value);

    if (uitslag.status === "onbekend"){
      state.__adresCheck = { status: "onbekend" };
      render();
      return;
    }
    if (uitslag.status === "gevonden"){
      const g = uitslag.gevonden;
      const anders = (x, y) => x.replace(/\s/g, "").toLowerCase() !== y.replace(/\s/g, "").toLowerCase();
      if (anders(g.zip, adres.zip) || anders(g.city, adres.city)){
        state.__adresCheck = { status: "afwijkend", voorstel: g };
        render();
        return;
      }
    }
    // gevonden en gelijk, of we konden het niet nakijken: laat de klant door
    state.__checkout = { country: sel.value, address: adres };
    state.__adresCheck = null;
    go("payment");
  };
}

/* --------------------------- bestellingsopvolging --------------------------- */
const ORDER_STEPS = ["In verwerking", "Wordt geprint", "Verzonden", "Geleverd"];
/* Werkdagen na de bestelling: printen plus verzending, per bestemming. */
const DELIVERY_DAYS = {
  "België": [3, 5], "Nederland": [4, 6], "Duitsland": [4, 7], "Frankrijk": [4, 7],
  "Andere EU-landen": [5, 9], "Buiten de EU": [8, 15],
};
function addWorkingDays(from, days){
  const d = new Date(from);
  let left = days;
  while (left > 0){
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) left--;
  }
  return d;
}
function fmtDate(d){ return d.toLocaleDateString('nl-BE', { day:'numeric', month:'long' }); }
function deliveryWindow(o){
  const [min, max] = DELIVERY_DAYS[o.shippingCountry] || DELIVERY_DAYS["België"];
  return { from: addWorkingDays(o.createdAt, min), to: addWorkingDays(o.createdAt, max) };
}
function orderNumber(o){ return "#" + String(o.id || "").slice(-6).toUpperCase(); }

function orderTracker(o){
  const idx = Math.max(0, ORDER_STEPS.indexOf(o.status));
  return `<div class="track">${ORDER_STEPS.map((s,i)=>`
    <div class="track-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
      <span class="track-dot"></span><span class="track-label">${esc(s)}</span>
    </div>`).join("")}</div>`;
}
function etaLine(o){
  if (o.status === "Geleverd"){
    // Heeft de klant het zelf bevestigd, dan is het rond. Zette de shop hem op
    // geleverd, dan mag de klant het nog altijd zelf bevestigen.
    if (o.receivedAt) return `
      <div class="eta"><i class="fa-solid fa-box-open" aria-hidden="true"></i>
        <strong>Ontvangen.</strong> Bevestigd op ${esc(new Date(o.receivedAt).toLocaleDateString('nl-BE', { day:'numeric', month:'long', year:'numeric' }))}.
      </div>`;
    return `
      <div class="eta" style="display:block;">
        <p style="margin:0 0 4px;">${ic("box-open")} <strong>Geleverd.</strong></p>
        <p class="muted" style="font-size:12px;margin:0 0 10px;">Is je pakket aangekomen? Laat het ons weten, dan weten wij dat het goed is aangekomen.</p>
        <button class="btn btn-accent btn-sm" onclick="window.__confirmReceived('${o.id}')">
          ${ic("circle-check")} Ontvangen
        </button>
      </div>`;
  }
  const w = deliveryWindow(o);
  if (o.status === "Verzonden"){
    return `
      <div class="eta" style="display:block;">
        <p style="margin:0 0 4px;">${ic("truck")} Onderweg — verwacht tussen <strong>${esc(fmtDate(w.from))}</strong> en <strong>${esc(fmtDate(w.to))}</strong></p>
        <p class="muted" style="font-size:12px;margin:0 0 10px;">Is je pakket aangekomen? Laat het ons weten, dan weten wij dat het goed is aangekomen.</p>
        <button class="btn btn-accent btn-sm" onclick="window.__confirmReceived('${o.id}')">
          ${ic("circle-check")} Ontvangen
        </button>
      </div>`;
  }
  return `<div class="eta">${ic("truck")} Verwachte levering tussen <strong>${esc(fmtDate(w.from))}</strong> en <strong>${esc(fmtDate(w.to))}</strong></div>`;
}

          <select class="field slotfil" data-i="${i}" style="margin:0;flex:1;min-width:0;">
            <option value="">standaardkleur…</option>
            ${list.map(f => `<option value="${esc(f.id)}" ${f.id===sl.filamentId?'selected':''}>${esc(f.type)} · ${esc(f.name)}</option>`).join("")}
          </select>
          <button class="btn btn-ghost btn-sm slotdel" data-i="${i}" title="Weg">${ic("trash")}</button>
        </div>`).join("")
        : `<p class="muted" style="font-size:12px;margin:0;">Nog geen onderdelen — het model krijgt één kleur.</p>`}
    </div>`;
}

/* =====================================================================
   Archief
   Alles blijft bewaard. Hier staat elke bestelling, ook wat uit het gewone
   overzicht is gehaald: op datum gesorteerd, doorzoekbaar op naam of nummer,
   en te filteren op status.
   ===================================================================== */
function archiefTotaal(){
  return state.profile?.isAdmin
    ? state.orders.length
    : state.orders.filter(o => o.uid === state.user?.uid).length;
}
function archiefRijen(){
  const zoek = (state.__archZoek || "").trim().toLowerCase();
  const status = state.__archStatus || "alles";
  const oud = state.__archOud === true;
  // Als beheerder staat hier alles; als klant alleen wat van jou is.
  const bron = state.profile?.isAdmin
    ? state.orders
    : state.orders.filter(o => o.uid === state.user?.uid);
  return bron
    .filter(o => status === "alles" ? true : o.status === status)
    .filter(o => {
      if (!zoek) return true;
      const hooi = [
        o.userEmail, orderNumber(o),
        ...(o.items || []).map(i => i.name),
        o.shippingAddress?.city, o.shippingAddress?.street,
      ].filter(Boolean).join(" ").toLowerCase();
      return hooi.includes(zoek);
    })
    .sort((a,b) => oud ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);
}
function viewArchief(){
  if (!state.user) return `<div style="padding:32px 0;"><p class="muted">Je bent niet ingelogd.</p></div>`;
  const beheer = !!state.profile?.isAdmin;
  const rijen = archiefRijen();
  const status = state.__archStatus || "alles";
  return `
    <div style="padding:32px 0;">
      <button class="back" onclick="go('${beheer ? "admin" : "account"}')">${ic("arrow-left")} Terug</button>
      <h1 class="font-display" style="font-size:24px;margin:0 0 4px;">Archief</h1>
      <p class="muted" style="font-size:13px;margin:0 0 18px;max-width:60ch;">
        ${beheer ? "Alle bestellingen die ooit binnenkwamen" : "Al je bestellingen"} — ook die uit het
        overzicht gehaald zijn. Hier gaat nooit iets verloren.
      </p>

      <div class="cart-item" style="margin-bottom:14px;">
        <input id="archZoek" placeholder="Zoek op naam, bestelnummer, product of plaats…"
               value="${esc(state.__archZoek || "")}" style="margin:0 0 10px;" />
        <div class="fil-types" style="margin:0;">
          ${["alles", ...ORDER_STEPS].map(x=>`
            <button class="fil-type ${x===status?'active':''}" data-archstatus="${esc(x)}">${esc(x === "alles" ? "Alles" : x)}</button>`).join("")}
        </div>
        <div class="between" style="margin-top:10px;">
          <span class="muted font-mono" style="font-size:11px;">${rijen.length} van ${archiefTotaal()}</span>
          <button class="btn btn-ghost btn-sm" id="archSort">
            ${ic(state.__archOud ? "arrow-up-1-9" : "arrow-down-9-1")} ${state.__archOud ? "Oudste eerst" : "Nieuwste eerst"}
          </button>
        </div>
      </div>

      ${rijen.length ? rijen.map(o => `
        <div class="order-card" style="margin-bottom:10px;${(beheer ? o.hiddenForShop : o.hiddenForUser) ? "opacity:.6;" : ""}">
          <div class="between" style="gap:10px;flex-wrap:wrap;">
            <div style="min-width:0;">
              <span class="font-mono" style="font-size:12px;">${esc(orderNumber(o))}</span>
              <span class="muted font-mono" style="font-size:11px;"> &middot; ${esc(new Date(o.createdAt).toLocaleString('nl-BE'))}</span>
              ${beheer ? `<div class="muted" style="font-size:12px;">${esc(o.userEmail)}</div>` : ``}
              <div class="muted" style="font-size:12px;">${esc((o.items || []).map(i => `${i.qty}× ${i.name}`).join(" · "))}</div>
            </div>
            <div style="text-align:right;white-space:nowrap;">
              <span class="badge${o.receivedAt ? " badge-accent" : ""}">${o.receivedAt ? "Ontvangen" : esc(o.status)}</span>
              <div class="price" style="font-size:14px;">${fmtEUR(o.total)}</div>
            </div>
          </div>
          ${(beheer ? o.hiddenForShop : o.hiddenForUser) ? `
            <button class="detail-toggle" onclick="window.__unhideOrder('${o.id}','${beheer ? "shop" : "klant"}')">
              ${ic("eye")} Terugzetten in het overzicht
            </button>` : ``}
        </div>`).join("")
        : `<p class="muted" style="font-size:13px;">Niets gevonden met deze zoekopdracht.</p>`}
    </div>`;
}
function attachArchiefHandlers(){
  const z = document.getElementById('archZoek');
  if (z){
    z.oninput = () => {
      state.__archZoek = z.value;
      // alleen de lijst verversen, zodat de cursor in het zoekveld blijft staan
      const app = document.getElementById('app');
      const pos = z.selectionStart;
      app.innerHTML = viewArchief();
      attachArchiefHandlers();
      const n = document.getElementById('archZoek');
      if (n){ n.focus(); n.setSelectionRange(pos, pos); }
    };
  }
  document.querySelectorAll('[data-archstatus]').forEach(b=>{
    b.onclick = () => { state.__archStatus = b.dataset.archstatus; render(); };
  });
  const sort = document.getElementById('archSort');
  if (sort) sort.onclick = () => { state.__archOud = !state.__archOud; render(); };
}

function viewBeheerOverzicht(openstaand){
  const lopend = openstaand.filter(o => o.status !== "Geleverd");

  const printen = lopend.filter(o => o.status === "Wordt geprint").length;
  const onderweg = lopend.filter(o => o.status === "Verzonden").length;
  const teHalen = state.orders.filter(o => o.pickupAt && o.status !== "Geleverd").length;
  const maand = Date.now() - 30 * 864e5;
  const omzet = state.orders.filter(o => o.createdAt > maand).reduce((s, o) => s + (o.total || 0), 0);
  const opRaken = (state.products || []).filter(p => !sizingOf(p) && (p.stock ?? 0) > 0 && (p.stock ?? 0) <= 3);
  const uitverkocht = (state.products || []).filter(p => !sizingOf(p) && (p.stock ?? 0) <= 0);
  const kaart = (cijfer, naam, let_) => `
    <div class="kpi${let_ ? " let" : ""}"><div class="cijfer">${cijfer}</div><div class="naam">${esc(naam)}</div></div>`;
  return `
    <div class="paneel-kop">

      <p>Waar je vandaag aan toe bent.</p>
    </div>
    <div class="kpi-grid">
      ${kaart(nieuw, "nieuw binnen", nieuw > 0)}
      ${kaart(printen, "aan het printen")}
      ${kaart(onderweg, "onderweg")}
      ${teHalen ? kaart(teHalen, "wordt afgehaald") : ""}
      ${kaart(fmtEUR(omzet), "laatste 30 dagen")}
    </div>

    ${nieuw ? `
      <div class="cart-item" style="border-color:var(--accent);margin-bottom:12px;">
        <p style="font-size:13px;font-weight:600;margin:0 0 4px;color:var(--accent);">
          ${ic("bell")} ${nieuw} bestelling${nieuw > 1 ? "en" : ""} wacht${nieuw > 1 ? "en" : ""} op je
        </p>
        <p class="muted" style="font-size:12px;margin:0 0 10px;">Zet ze op <em>Wordt geprint</em> zodra je begint.</p>
        <button class="btn btn-accent btn-sm" onclick="window.__setAdminTab('orders')">Naar de bestellingen</button>
      </div>` : `
      <div class="cart-item" style="margin-bottom:12px;">
        <p style="font-size:13px;margin:0;">${ic("circle-check")} Niets dat op je wacht.</p>

    ${(opRaken.length || uitverkocht.length) ? `
      <div class="cart-item" style="margin-bottom:12px;">
        <p style="font-size:13px;font-weight:600;margin:0 0 6px;">${ic("boxes-stacked")} Voorraad</p>
        ${uitverkocht.map(p => `<p style="font-size:13px;margin:0 0 3px;">
          <span class="stock-dot" style="background:var(--muted);"></span>${esc(p.name)} — uitverkocht</p>`).join("")}

          <span class="stock-dot" style="background:var(--accent);"></span>${esc(p.name)} — nog ${p.stock}</p>`).join("")}

function attachFilamentHandlers(){
  const reset = document.getElementById('resetFilamentsBtn');
  if (reset) reset.onclick = async () => {
    reset.disabled = true;
    try{ await saveFilaments(buildDefaultFilaments()); notify("Catalogus geladen"); }
    catch(err){ notify("Mislukt: " + err.message); reset.disabled = false; }
  };

  document.querySelectorAll('[data-filtoggle]').forEach(btn=>{
    btn.onclick = async () => {
      const items = (state.filaments || []).map(f =>
        f.id === btn.dataset.filtoggle ? { ...f, enabled: !f.enabled } : f);
      state.filaments = items;                       // meteen zichtbaar
      btn.classList.toggle('on');
      try{ await saveFilaments(items); }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-filtypetoggle]').forEach(btn=>{
    btn.onclick = async () => {
      const on = btn.dataset.target === 'on';
      const items = (state.filaments || []).map(f =>
        f.type === btn.dataset.filtypetoggle ? { ...f, enabled: on } : f);
      try{ await saveFilaments(items); }catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('.kgfield').forEach(el=>{
    el.onchange = async () => {
      const v = parseFloat(el.value);
      if (!isFinite(v) || v < 0){ notify("Vul een geldig bedrag in"); return; }
      const items = (state.filaments || []).map(f =>
        f.type === el.dataset.type ? { ...f, pricePerKg: v } : f);
      try{ await saveFilaments(items); notify(`${el.dataset.type}: ${fmtEUR(v)} per kilo`); }
      catch(err){ notify("Opslaan mislukt: " + err.message); }
    };
  });

  document.querySelectorAll('[data-fildelete]').forEach(btn=>{
    btn.onclick = async () => {
      const items = (state.filaments || []).filter(f => f.id !== btn.dataset.fildelete);
      try{ await saveFilaments(items); notify("Filament verwijderd"); }
      catch(err){ notify("Verwijderen mislukt: " + err.message); }
    };
  });

  const add = document.getElementById('addFilamentBtn');
  if (add) add.onclick = async () => {
    const v = id => (document.getElementById(id)?.value || "").trim();
    const type = v('nfType'), name = v('nfName');
    let hex = v('nfHex');
    if (!type || !name){ notify("Vul type en kleurnaam in"); return; }
    if (!hex.startsWith("#")) hex = "#" + hex;
    if (!/^#[0-9a-f]{6}$/i.test(hex)){ notify("Gebruik een kleurcode als #00AE42"); return; }
    const id = slug(type) + "--" + slug(name);
    if ((state.filaments || []).some(f => f.id === id)){ notify("Dat filament staat er al in"); return; }
    const items = [...(state.filaments || []), {
      id, type, name, hex: hex.toUpperCase(), finish: v('nfFinish') || "basic",
      enabled: true, custom: true,
    }];
    try{ await saveFilaments(items); notify("Filament toegevoegd"); }
    catch(err){ notify("Opslaan mislukt: " + err.message); }
  };
}

/* Het model moet er weer uit kunnen om te printen. Staat het in Storage, dan
   is er een gewone link; staat het in Firestore, dan zetten we de stukken
   hier weer aan elkaar. */
function jobFileButton(item, part){
  if (part.storageUrl){
    return `<a class="btn btn-ghost btn-sm" href="${esc(part.storageUrl)}" target="_blank" rel="noopener" download>
      ${ic("download")} Bestand</a>`;
  }
  if (part.storage?.kind === "firestore" && item.uploadId){
    return `<button class="btn btn-ghost btn-sm" data-file="${esc(item.uploadId)}"
      data-index="${part.index}" data-chunks="${part.storage.chunks}"
      data-gz="${part.storage.gz ? 1 : 0}" data-bytes="${part.storage.bytes || 0}"
      data-sha="${esc(part.storage.sha || '')}" data-name="${esc(part.fileName || 'model.stl')}"
      title="${esc(part.fileName || '')}${part.storage.sha ? ' · SHA-256 ' + part.storage.sha.slice(0,12) : ''}">
      ${ic("download")} Bestand</button>`;
  }
  return ``;
}
function attachFileHandlers(){
  document.querySelectorAll('[data-file]').forEach(btn=>{
    btn.onclick = async () => {
      const was = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `${ic("spinner")} Ophalen…`;
      try{
        await downloadStoredFile(btn.dataset.file, +btn.dataset.index, {
          chunks: +btn.dataset.chunks,
          gz: btn.dataset.gz === "1",
          bytes: +btn.dataset.bytes || 0,
          sha: btn.dataset.sha || null,
        }, btn.dataset.name);
      }catch(err){ notify("Ophalen mislukt: " + err.message); }
      finally{ btn.disabled = false; btn.innerHTML = was; }
    };
  });
}

function attachPricingHandlers(){
  listenMail();
  listenCodes();

  // --- afhalen ---
  const pu = () => (state.__draftPickup ||= { ...afhalen() });
  const puVeld = (id, key, getal) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => { pu()[key] = getal ? (parseFloat(el.value) || 0) : el.value; };
  };
  const puOn = document.getElementById('puOn');
  if (puOn) puOn.onchange = () => { pu().enabled = puOn.checked; render(); };
  puVeld('puAddress', 'address'); puVeld('puNote', 'note');
  puVeld('puSlot', 'slotMinutes', true); puVeld('puLead', 'leadHours', true); puVeld('puWeeks', 'weeks', true);
  const puAdd = document.getElementById('puAdd');
  if (puAdd) puAdd.onclick = () => {
    const p = pu();
    p.days = [...(p.days || []), { day: 6, from: "10:00", to: "12:00" }];
    render();
  };
  document.querySelectorAll('.puday').forEach(el => {
    el.onchange = () => { pu().days[+el.dataset.i].day = +el.value; render(); };
  });
  document.querySelectorAll('.pufrom').forEach(el => { el.oninput = () => { pu().days[+el.dataset.i].from = el.value; }; });
  document.querySelectorAll('.puto').forEach(el => { el.oninput = () => { pu().days[+el.dataset.i].to = el.value; }; });
  document.querySelectorAll('.pudel').forEach(el => {
    el.onclick = () => { pu().days.splice(+el.dataset.i, 1); render(); };
  });

  // --- kortingscodes ---
  const cdAdd = document.getElementById('cdAdd');
  if (cdAdd) cdAdd.onclick = async () => {
    const v = id => (document.getElementById(id)?.value || "").trim();
    const code = codeNet(v('cdName'));
    if (!/^[A-Z0-9-]{3,24}$/.test(code)){
      notify("Een code bestaat uit 3 tot 24 letters, cijfers of streepjes"); return;
    }
    const pct = parseInt(v('cdPct'), 10) || 0;
    const euro = parseFloat(v('cdEuro')) || 0;
    if (!pct && !euro){ notify("Vul een percentage of een bedrag in"); return; }
    try{
      await setDoc(doc(db, "codes", code), {
        pct: pct || 0, euro: pct ? 0 : euro,
        minTotal: parseFloat(v('cdMin')) || 0,
        maxUses: parseInt(v('cdMax'), 10) || 0,
        until: v('cdUntil') ? new Date(v('cdUntil') + "T23:59:59").getTime() : null,
        active: true, used: 0, createdAt: Date.now(),
      });
      for (const id of ['cdName','cdPct','cdEuro','cdMin','cdMax','cdUntil']){
        const el = document.getElementById(id); if (el) el.value = "";
      }
      notify(`Code ${code} aangemaakt`);
    }catch(e){ notify("Opslaan mislukt: " + e.message); }
  };
  document.querySelectorAll('.codedel').forEach(el => {
    el.onclick = async () => {
      if (!confirm(`Code ${el.dataset.code} verwijderen?`)) return;
      try{ await deleteDoc(doc(db, "codes", el.dataset.code)); notify("Code verwijderd"); }
      catch(e){ notify("Verwijderen mislukt: " + e.message); }
    };
  });

  const mailUit = () => {
    const uit = { ...mailSettings() };
    document.querySelectorAll('.mailfield').forEach(el => { uit[el.dataset.key] = el.value.trim(); });
    document.querySelectorAll('.mailswitch').forEach(el => { uit[el.dataset.key] = el.checked; });
    return uit;
  };
  const test = document.getElementById('testMailBtn');
  if (test) test.onclick = async () => {
    test.disabled = true; test.textContent = "Bezig…";
    try{ await saveMail(mailUit()); }catch(e){}
    const r = await sendMail("tplOrder", {
      to_email: state.user?.email || "", to_name: "Test",
      order_number: "#TEST", order_date: new Date().toLocaleDateString("nl-BE"),
      order_lines: "1 × Testproduct — € 0,00", order_subtotal: "€ 0,00",
      order_shipping: "€ 0,00", order_total: "€ 0,00", order_status: "Test",
      address: "Lepelstraat 8\n9280 Lebbeke\nBE", site_url: SITE_URL, account_url: SITE_URL,
      confirm_url: SITE_URL, delivery_from: "morgen", delivery_to: "overmorgen",
      mail_title: "Testbericht", mail_intro: "Als je dit leest, staat je e-mail goed ingesteld.",
      action_url: SITE_URL, action_label: "Naar de shop",
    });
    notify(r.ok ? `Testmail verstuurd naar ${state.user?.email}` : "Mislukt: " + r.reason);
    test.disabled = false; test.textContent = "Testmail sturen";
  };
  const save = document.getElementById('savePricingBtn');
  if (save) save.onclick = async () => {
    const out = { ...pricing() };
    document.querySelectorAll('.pricefield').forEach(el=>{
      const v = parseFloat(el.value);
      if (isFinite(v)) out[el.dataset.key] = v;
    });
    out.assemblyEnabled = !!document.getElementById('prAssembly')?.checked;
    const slicer = { ...slicerSettings() };
    document.querySelectorAll('.slicerfield').forEach(el=>{
      const v = parseFloat(el.value);
      if (isFinite(v) && v > 0) slicer[el.dataset.key] = v;
    });
    out.slicer = slicer;
    const tiers = (out.discountTiers || []).map(t => ({ ...t }));
    document.querySelectorAll('.tierfield').forEach(el=>{
      const i = parseInt(el.dataset.i,10);
      const v = parseFloat(el.value);
      if (tiers[i] && isFinite(v)) tiers[i][el.dataset.key] = v;
    });
    out.discountTiers = tiers.sort((a,b) => a.from - b.from);
    save.disabled = true;
    try{ await savePricing(out); notify("Prijzen opgeslagen"); }
    catch(err){ notify("Opslaan mislukt: " + err.message); save.disabled = false; }
  };

  // e-mail en afhalen hebben elk hun eigen knop
  const mailSave = document.getElementById('saveMailBtn');
  if (mailSave) mailSave.onclick = async () => {
    mailSave.disabled = true;
    try{ await saveMail(mailUit()); notify("E-mailinstellingen opgeslagen"); }
    catch(e){ notify("Opslaan mislukt: " + e.message); }
    mailSave.disabled = false;
  };
  const puSave = document.getElementById('savePickupBtn');
  if (puSave) puSave.onclick = async () => {
    const p = state.__draftPickup || afhalen();
    puSave.disabled = true;
    try{
      await savePickup({
        enabled: !!p.enabled, address: p.address || "", note: p.note || "",
        slotMinutes: Math.max(10, p.slotMinutes || 30),
        leadHours: Math.max(0, p.leadHours ?? 24),
        weeks: Math.min(8, Math.max(1, p.weeks || 2)),
        days: (p.days || []).map(d => ({ day: +d.day || 1, from: d.from || "17:00", to: d.to || "20:00" })),
      });
      state.__draftPickup = null;
      notify("Afhaalinstellingen opgeslagen");
    }catch(e){ notify("Opslaan mislukt: " + e.message); }
    puSave.disabled = false;
  };

  const reset = document.getElementById('resetPricingBtn');
  if (reset) reset.onclick = async () => {
    if (!confirm("Alle prijsinstellingen terugzetten naar de standaardwaarden?")) return;
    try{ await savePricing({ ...DEFAULT_PRICING }); notify("Standaardwaarden hersteld"); }
    catch(err){ notify("Mislukt: " + err.message); }
  };
}

/* Leest de maatwerkinstellingen uit het beheerformulier. */
function sizingFromForm(){
  if (!document.getElementById('pSizing')?.checked) return { enabled: false };
  const trio = key => [0,1,2].map(i =>
    parseInt(document.querySelector(`.sz[data-sz="${key}"][data-i="${i}"]`)?.value, 10) || 0);
  const num = (id, d) => { const v = parseInt(document.getElementById(id)?.value, 10); return isFinite(v) ? v : d; };
  return {
    enabled: true,
    def: trio('def'), min: trio('min'), max: trio('max'),
    solidity: Math.min(100, Math.max(1, num('pSolidity', 35))),
    infill: Math.min(100, Math.max(0, num('pSizeInfill', 20))),
    layerHeight: document.getElementById('pSizeLayer')?.value || "0.20mm",
  };
}

function attachAdminHandlers(){
  // zoeken en filteren in de bestellingen
  const oz = document.getElementById('ordZoek');
  if (oz) oz.oninput = () => {
    state.__ordZoek = oz.value;
    clearTimeout(state.__ordTimer);
    state.__ordTimer = setTimeout(() => {
      render();
      const el = document.getElementById('ordZoek');
      if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 260);
  };
  const os = document.getElementById('ordStatus');
  if (os) os.onchange = () => {
    state.__ordStatus = os.value === "Alle statussen" ? "alles" : os.value;
    render();
  };

  const ruim = document.getElementById('ruimOpBtn');
  if (ruim) ruim.onclick = async () => {
    const klaar = state.orders.filter(o => o.status === "Geleverd" && !o.hiddenForShop);
    ruim.disabled = true;
    try{
      for (const o of klaar) await updateDoc(doc(db, "orders", o.id), { hiddenForShop: true });
      notify(`${klaar.length} bestelling${klaar.length === 1 ? "" : "en"} opgeborgen`);
    }catch(err){ notify("Opbergen mislukt: " + err.message); ruim.disabled = false; }
  };
  attachFilamentHandlers();
  attachPricingHandlers();
  attachFileHandlers();
  const sizingBox = document.getElementById('pSizing');
  if (sizingBox) sizingBox.onchange = () => {
    document.getElementById('sizingFields').classList.toggle('hidden', !sizingBox.checked);
  };
  if (!Array.isArray(state.__draftImages)) state.__draftImages = [];
  if (!Array.isArray(state.__draftSlots)) state.__draftSlots = colorSlots(state.__editing ? state.products.find(p => p.id === state.__editing) || {} : {});

  const slotBtn = document.getElementById('addSlotBtn');
  if (slotBtn) slotBtn.onclick = () => {
    if (state.__draftSlots.length >= 10){ notify("Tien onderdelen is het maximum"); return; }
    state.__draftSlots = [...state.__draftSlots, { name: "", filamentId: null }];
    render();
  };
  document.querySelectorAll('.slotname').forEach(el=>{
    el.oninput = () => { state.__draftSlots[+el.dataset.i].name = el.value; };   // geen render: cursor blijft staan
  });
  document.querySelectorAll('.slotfil').forEach(el=>{
    el.onchange = () => { state.__draftSlots[+el.dataset.i].filamentId = el.value || null; };
  });
  document.querySelectorAll('.slotdel').forEach(el=>{
    el.onclick = () => { state.__draftSlots.splice(+el.dataset.i, 1); render(); };
  });
  renderImageTray();

  const fileInput = document.getElementById('pImgFile');
  if (fileInput) fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of files){
      if ((state.__draftImages || []).length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); break; }
      try{
        state.__draftImages.push(await fileToCompressedDataUrl(f));
        renderImageTray();
      }catch(err){ notify(err.message); }
    }
  };

  // 3D-voorbeeld: inlezen gebeurt hier, bewaren pas bij het opslaan van het
  // product — anders staat er een model bij een product dat nooit ontstaat.
  const modelKies = document.getElementById('pickModelBtn');
  if (modelKies) modelKies.onclick = () => document.getElementById('pModelFile').click();
  const modelInput = document.getElementById('pModelFile');
  if (modelInput) modelInput.onchange = async (e) => {
    const f = (e.target.files || [])[0];
    e.target.value = "";
    if (!f) return;
    const stand = document.getElementById('modelStand');
    if (stand) stand.textContent = "inlezen…";
    try{
      state.__draftModel = voorbeeldUitDelen(await analyzeFile(f));
      render();
      notify(`Model ingelezen — ${state.__draftModel.parts.length} ${state.__draftModel.parts.length > 1 ? "onderdelen" : "onderdeel"}`);
    }catch(err){
      state.__draftModel = undefined;
      render();
      notify("Kon dit model niet inlezen: " + (err.message || err));
    }
  };
  const modelWis = document.getElementById('wisModelBtn');
  if (modelWis) modelWis.onclick = () => { state.__draftModel = null; render(); };

  const urlBtn = document.getElementById('addImgUrlBtn');
  if (urlBtn) urlBtn.onclick = () => {
    const input = document.getElementById('pImgUrl');
    const url = input.value.trim();
    if (!url) return;
    if (!isSafeImageSrc(url)){ notify("Gebruik een https-adres van een afbeelding"); return; }
    if (state.__draftImages.length >= MAX_PRODUCT_IMAGES){ notify(`Maximaal ${MAX_PRODUCT_IMAGES} afbeeldingen`); return; }
    state.__draftImages.push(url);
    input.value = "";
    renderImageTray();
  };

  const btn = document.getElementById('addProductBtn');
  if (btn) btn.onclick = async () => {
    const val = id => (document.getElementById(id)?.value || "").trim();
    const name = val('pName');
    const price = parseFloat(val('pPrice'));
    if (!name){ notify("Vul een naam in"); return; }
    if (!isFinite(price) || price <= 0){ notify("Vul een geldige prijs in"); return; }

    const weight = parseInt(val('pWeight'),10);
    const data = {
      name, price,
      description: val('pDesc'),
      stock: parseInt(val('pStock'),10) || 0,
      discountPct: Math.min(90, Math.max(0, parseInt(val('pDiscount'),10) || 0)),
      discountUntil: val('pDiscountUntil') ? new Date(val('pDiscountUntil') + "T23:59:59").getTime() : null,
      colorSlots: (state.__draftSlots || [])
        .map(sl => ({ name: (sl.name || "").trim(), filamentId: sl.filamentId || null }))
        .filter(sl => sl.name)
        .slice(0, 10),
      category: val('pCategory'),
      color: val('pColor'),
      material: val('pMaterial'),
      infill: val('pInfill') || "20%",
      layerHeight: val('pLayer') || "0.2mm",
      dimensions: val('pDim'),
      printTime: val('pTime'),
      weight: isFinite(weight) ? weight : 0,
      sizing: sizingFromForm(),
      filamentTypes: [...document.querySelectorAll('.ptype:checked')].map(c => c.value),
      featured: !!document.getElementById('pFeatured')?.checked,
      images: (state.__draftImages || []).filter(isSafeImageSrc).slice(0, MAX_PRODUCT_IMAGES),
      icon: "cube",
    };
    // undefined = ongemoeid laten, een model = vervangen, null = weghalen
    const model = state.__draftModel;
    if (model !== undefined) data.has3d = !!model;

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Opslaan…";
    try{
      let id;
      if (state.__editing){
        id = state.__editing;
        await updateProduct(id, data);
        state.__editing = null;
      } else {
        id = await addProduct(data);
      }
      if (model) await bewaarVoorbeeld(id, model);
      else if (model === null) await wisVoorbeeld(id);
      if (model !== undefined) voorbeeldCache.delete(id);
      state.__draftImages = [];
      state.__draftSlots = null;
      state.__draftModel = undefined;
      render();
      window.scrollTo(0,0);
    }catch(err){
      notify("Opslaan mislukt: " + err.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  };
}

/* Een handvat om in de console (of in een test) te kunnen nakijken wat de
   slicer van een model maakt: window.__lc.partSlice(__lc.state.parts[0]) */
window.__lc = {
  get state(){ return state; },
  sliceMesh, partSlice, partEstimate, projectTotals,
  pricing, slicerSettings, render,
  slotFilament, currentFilament,
};

/* --------------------------- boot --------------------------- */
listenMail();     // ook een klant moet post kunnen krijgen
listenProducts();
listenFilaments();
listenPricing();
listenPickup();
renderAuthNav();
render();
</script>
